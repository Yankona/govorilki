    { id: "spb-mariinsky", e: "🩰", t: "Где родился «Щелкунчик»", s: "Мариинский театр — один из самых знаменитых театров мира. Его назвали в честь императрицы Марии Александровны. Зрительный зал внутри голубой с золотом, а под потолком сияет огромная люстра. Именно здесь в 1892 году впервые показали балет «Щелкунчик» с музыкой Петра Чайковского. Сейчас его танцуют здесь каждую зиму, перед Новым годом.",
      q: "Какой балет впервые показали в Мариинском театре?", a: ["«Щелкунчик»", "«Колобок на льду»", "«Танец бегемотов»"] },
    { id: "spb-aurora", e: "🚢", t: "Корабль с тремя трубами", s: "У Петроградской набережной стоит настоящий старый военный корабль — крейсер «Аврора». Его построили в Петербурге и спустили на воду в 1900 году. Узнать его легко: у него три высокие трубы. Аврора — это имя древней богини утренней зари. Сейчас корабль стал музеем: можно подняться на палубу, рассмотреть пушки и узнать, как жили моряки.",
      q: "Сколько труб у крейсера «Аврора»?", a: ["Три", "Ни одной", "Сто"] },
    { id: "spb-nevsky", e: "🚶", t: "Главная улица города", s: "Невский проспект — главная улица Петербурга. Он начинается у Адмиралтейства, на шпиле которого блестит золотой кораблик, и тянется четыре с половиной километра. По пути Невский перешагивает по мостам через реку Мойку, канал Грибоедова и реку Фонтанку. Заканчивается он у Александро-Невской лавры. От неё проспект и получил своё имя.",
      q: "Что блестит на шпиле Адмиралтейства?", a: ["Золотой кораблик", "Серебряная ложка", "Шоколадная звезда"] },
    { id: "spb-anichkov-horses", e: "🐎", t: "Кони на Аничковом мосту", s: "Аничков мост перекинут через Фонтанку прямо на Невском проспекте. По его углам стоят четыре бронзовые скульптуры: юноша укрощает горячего коня. Их сделал скульптор Пётр Клодт, который очень любил лошадей. Во время войны скульптуры сняли и бережно закопали в саду рядом, чтобы сохранить. Потом кони вернулись на свои места.",
      q: "Кто стоит рядом с конями на Аничковом мосту?", a: ["Юноши, которые укрощают коней", "Клоуны с шариками", "Пингвины в шапках"] },
    { id: "spb-lion-griffin-bridges", e: "🦁", t: "Мостики, которые держат звери", s: "Через канал Грибоедова перекинуты два узких мостика со зверями. На Львином мосту сидят четыре льва и держат в пастях цепи, на которых висит мост. А на Банковском мосту сидят грифоны — сказочные звери с телом льва и крыльями. Крылья у грифонов золотые! По этим мостикам ходят только пешком.",
      q: "Что держат в пастях львы на Львином мосту?", a: ["Цепи", "Сосиски", "Зубные щётки"] },
    { id: "spb-fontanka", e: "⛲", t: "Речка без имени", s: "Река Фонтанка течёт через самый центр Петербурга. Когда-то у неё даже не было настоящего имени: её звали Безымянный ерик, то есть протока без имени. Потом рядом разбили Летний сад с фонтанами, и воду для них брали из этой речки. Так река и стала Фонтанкой. Сегодня по ней плавают прогулочные катера.",
      q: "Почему реку назвали Фонтанкой?", a: ["Она давала воду для фонтанов", "В ней жили говорящие рыбы", "В ней купались слоны"] },
    { id: "spb-new-holland", e: "🏝️", t: "Остров, который сделали люди", s: "Новая Голландия — остров-треугольник, который появился, когда люди прокопали вокруг каналы. На нём хранили и сушили брёвна для кораблей. Назвали его в честь Голландии, где Пётр Первый учился строить корабли. Со стороны Мойки видна огромная каменная арка: через неё лодки заплывали внутрь острова. Теперь здесь парк, летом все лежат на траве, а зимой катаются на коньках.",
      q: "Что раньше хранили на острове Новая Голландия?", a: ["Брёвна для кораблей", "Мороженое для царя", "Игрушки для медведей"] },
    { id: "spb-rostral-columns", e: "🔥", t: "Колонны с носами кораблей", s: "На стрелке Васильевского острова стоят две красные колонны. На них торчат носы кораблей — ростры, поэтому колонны называют Ростральными. Раньше на их верхушках горел огонь, он показывал кораблям путь. Теперь огонь зажигают по праздникам. А внизу сидят каменные великаны: говорят, это реки Волга, Днепр, Нева и Волхов.",
      q: "Как называются носы кораблей на колоннах?", a: ["Ростры", "Пирожки", "Тапочки"] },
    { id: "spb-sphinxes", big: 1, e: "🏺", t: "Сфинксы из Египта", s: "На набережной Невы у Академии художеств лежат два сфинкса — львы с головой человека. Они самые настоящие, из Древнего Египта! Их вырезали из гранита больше трёх тысяч лет назад, и лицо у них — как у фараона Аменхотепа Третьего. Сфинксов привезли в Петербург на корабле по морю. Теперь они смотрят друг на друга над Невой.",
      q: "Откуда привезли сфинксов?", a: ["Из Египта", "С Северного полюса", "С Луны"] },
    { id: "spb-botanic-garden", e: "🌵", t: "Царица ночи", s: "Ботанический сад основал Пётр Первый в 1714 году. Сначала здесь выращивали лечебные травы, и сад называли Аптекарским огородом. Сейчас в его стеклянных оранжереях растут пальмы и цветы из жарких стран. Самый знаменитый — кактус «Царица ночи». Его огромный белый цветок раскрывается ночью, а к утру вянет. Чтобы все могли его увидеть, сад иногда открывают ночью!",
      q: "Когда раскрывается цветок «Царицы ночи»?", a: ["Ночью", "Только в обед", "Когда чихнёт садовник"] },
    { id: "spb-elagin", e: "🌅", t: "Остров, где провожают солнце", s: "Елагин остров — большой зелёный парк, где не ездят машины. Здесь можно гулять по аллеям, кататься на лодке и кормить белок. Остров назван по фамилии одного из его хозяев, Ивана Елагина. На западном краю острова, на стрелке, сидят каменные львы. Отсюда люди любят смотреть, как солнце садится в Финский залив.",
      q: "Куда садится солнце, если смотреть со стрелки Елагина острова?", a: ["В Финский залив", "В кастрюлю с супом", "В карман ко льву"] },
    { id: "spb-kronstadt", big: 1, e: "⚓", t: "Где начинается отсчёт", s: "Кронштадт — город на острове Котлин посреди Финского залива. Туда можно доехать на машине по дамбе и даже проехать в тоннеле под водой. В Кронштадте на мосту есть медная пластинка с чёрточкой. Это футшток: от него в нашей стране считают высоту гор и глубину морей. Получается, отсчёт для всей России начинается здесь!",
      q: "Что считают от Кронштадтского футштока?", a: ["Высоту гор и глубину морей", "Количество котлет", "Возраст черепах"] },
    { id: "spb-amber-room", e: "💛", t: "Комната из янтаря", s: "В Царском Селе стоит голубой Екатерининский дворец, а в нём — Янтарная комната. Её стены украшены янтарём, это окаменевшая смола древних деревьев. Когда-то прусский король подарил эту комнату Петру Первому. Во время войны она пропала, и её до сих пор не нашли. Тогда мастера больше двадцати лет делали её заново, и теперь она снова сияет, как мёд на солнце.",
      q: "Из чего сделана Янтарная комната?", a: ["Из янтаря", "Из мармелада", "Из шоколадных конфет"] },
    { id: "spb-pavlovsk-squirrels", e: "🐿️", t: "Белки Павловского парка", s: "Павловск — городок рядом с Петербургом, где есть огромный парк с дворцом. Главные хозяева парка — белки! Они совсем не боятся людей. Если тихонько протянуть ладошку с орешком, белка может спрыгнуть с дерева и взять угощение прямо с руки. Только орешки нужны несолёные и нежареные, так белкам полезнее.",
      q: "Какие орешки нужны белкам?", a: ["Несолёные и нежареные", "В шоколадной глазури", "Острые, с перцем"] },
    { id: "spb-gatchina", e: "🪵", t: "Домик-сюрприз в Гатчине", s: "В Гатчинском парке стоит Берёзовый домик. Снаружи он похож на простую поленницу, то есть на сложенные дрова. Но внутри прячутся нарядные комнаты! Это сюрприз, который жена подарила будущему императору Павлу. А из Гатчинского дворца к Серебряному озеру ведёт подземный ход. В нём есть грот «Эхо»: крикни — и он тебе ответит.",
      q: "На что снаружи похож Берёзовый домик?", a: ["На поленницу дров", "На большой торт", "На спящего медведя"] },
    { id: "spb-oranienbaum", e: "🍊", t: "Апельсиновое дерево и горка", s: "Ораниенбаум — старинный дворец с парком на берегу Финского залива. Его название по-немецки значит «апельсиновое дерево». При Екатерине Второй здесь построили Катальную горку: гости садились в тележки и мчались вниз по длинному спуску. Сама горка не сохранилась, остался красивый павильон. А в Португалии такие аттракционы до сих пор называют «русскими горами»!",
      q: "Что значит слово «Ораниенбаум»?", a: ["Апельсиновое дерево", "Лимонный торт", "Банановый пароход"] },
    { id: "spb-smolny", e: "💙", t: "Почему Смольный так называется", s: "На берегу Невы стоит голубой с белым Смольный собор, он похож на нарядный торт. А название у него от слова «смола». При Петре Первом здесь был Смоляной двор: тут хранили смолу для кораблей, чтобы они не протекали. Позже рядом открыли Смольный институт, одну из первых в России школ для девочек.",
      q: "От какого слова произошло название «Смольный»?", a: ["От слова «смола»", "От слова «смайлик»", "От слова «смородина»"] },
    { id: "spb-metro", e: "🚇", t: "Самое глубокое метро", s: "Метро в Петербурге — одно из самых глубоких в мире. Строить его пришлось глубоко под землёй, ведь наверху мокрая мягкая земля, реки и каналы. Самая глубокая станция в России — «Адмиралтейская», она на глубине восемьдесят шесть метров. Это почти как дом в тридцать этажей, только вниз! Поэтому эскалаторы здесь очень длинные.",
      q: "Какая станция метро самая глубокая в России?", a: ["«Адмиралтейская»", "«Мороженая»", "«Подушкинская»"] },
    { id: "spb-lakhta", big: 1, e: "🏙️", t: "Самая высокая башня Европы", s: "На берегу Финского залива, в Лахте, стоит стеклянная башня. Её высота вместе со шпилем — четыреста шестьдесят два метра, это самое высокое здание в Европе. Башня закручивается вверх, словно язык пламени. В ясный день её видно из многих районов города. А рядом Финский залив: летом там можно бегать по песку и смотреть на закат.",
      q: "Где стоит самое высокое здание Европы?", a: ["В Лахте, у Финского залива", "На крыше Эрмитажа", "В аквариуме зоопарка"] },
    { id: "spb-h-domik", e: "🏠", t: "Домик, построенный за три дня", s: "Когда город только начинали строить, для царя Петра Первого срубили деревянный домик. Солдаты-плотники построили его всего за три дня! Брёвна раскрасили так, чтобы домик казался кирпичным. Пётр жил в нём летом и смотрел из окон на Неву. Домик сохранился до наших дней, а сверху его бережно укрывает каменный дом, как шкатулка.",
      q: "За сколько дней построили домик Петра?", a: ["За три дня", "За три минуты", "За триста лет"] },
    { id: "spb-h-plotnik", e: "🪓", t: "Царь-плотник", s: "Пётр Первый мечтал, чтобы у России был свой флот. Он поехал в Голландию и пошёл работать на верфь, где строят корабли, простым плотником. Там его звали Пётр Михайлов, и он вместе с мастерами строил настоящий корабль. В Петербурге Пётр устроил большую верфь, Адмиралтейство. Он часто сам брал в руки топор и работал рядом с корабельными мастерами.",
      q: "Каким именем называли Петра на голландской верфи?", a: ["Пётр Михайлов", "Капитан Крючок", "Дядя Фёдор"] },
    { id: "spb-h-botik", e: "⛵", t: "Дедушка русского флота", s: "Когда Пётр был ещё юношей, он нашёл в старом амбаре маленькую заморскую лодку с парусом — ботик. Голландский мастер починил ботик, и Пётр научился на нём ходить под парусом. С этого началась его любовь к морю. Через много лет Пётр привёз ботик в Петербург и сам провёл его по Неве, а следом плыли большие корабли. С тех пор ботик называют «дедушкой русского флота»: ведь с него всё и началось.",
      q: "Как называют ботик Петра?", a: ["Дедушкой русского флота", "Бабушкой русского супа", "Тётушкой русской каши"] },
    { id: "spb-h-assamblei", e: "💃", t: "Ассамблеи Петра", s: "В 1718 году Пётр Первый придумал в Петербурге ассамблеи. Это были весёлые вечера в домах знатных людей. Гости танцевали, разговаривали, играли в шахматы и шашки. На ассамблеи звали и женщин, а раньше в России так было не принято. Пётр и сам приходил на эти вечера и танцевал вместе со всеми.",
      q: "Во что играли гости на ассамблеях?", a: ["В шахматы и шашки", "В компьютерные игры", "В футбол на крыше"] },
    { id: "spb-h-ekaterina", e: "🖼️", t: "Екатерина и её картины", s: "Императрица Екатерина Вторая очень любила картины. В 1764 году она купила сразу больше двухсот картин у одного купца из Берлина. Место, где она хранила свои сокровища, назвали Эрмитажем. Это французское слово, оно значит «уединённое место». Сначала картины видели только императрица и её гости, а теперь из её коллекции вырос огромный музей для всех.",
      q: "Что любила собирать Екатерина Вторая?", a: ["Картины", "Фантики от конфет", "Пустые банки"] },
    { id: "spb-h-licej", e: "📜", t: "Пушкин в лицее", s: "В 1811 году в Царском Селе под Петербургом открыли лицей, школу для мальчиков. Одним из первых учеников стал двенадцатилетний Саша Пушкин. Друзья звали его «Француз», потому что он отлично знал французский язык. На экзамене Пушкин читал свои стихи старому знаменитому поэту Державину. Державин был в восторге и хотел обнять юного поэта, а тот от волнения убежал.",
      q: "Какое прозвище было у Пушкина в лицее?", a: ["Француз", "Пингвин", "Пирожок"] },
    { id: "spb-h-mendeleev", e: "🧪", t: "Таблица с пустыми клеточками", s: "Всё вокруг состоит из крошечных кирпичиков — химических элементов: железа, золота, кислорода и других. Петербургский учёный Дмитрий Менделеев разложил их по порядку в одну таблицу. Для некоторых он оставил пустые клеточки и сказал: их ещё найдут! Через несколько лет учёные и правда открыли эти элементы. Огромная таблица Менделеева выложена на стене дома на Московском проспекте.",
      q: "Что Менделеев оставил в своей таблице?", a: ["Пустые клеточки", "Отпечаток варенья", "Рисунок кота"] },
    { id: "spb-h-pavlov", e: "🐕", t: "Павлов и его собаки", s: "Учёный Иван Павлов изучал, как работает наш организм, и ему помогали собаки. Он заметил: если перед едой всегда звучит один и тот же звук, собака скоро начинает ждать угощение, как только его услышит. За свои открытия Павлов первым в России получил Нобелевскую премию. Он был очень благодарен собакам и попросил поставить в Петербурге памятник собаке.",
      q: "Кто помогал Павлову в его опытах?", a: ["Собаки", "Крокодилы", "Пингвины"] },
    { id: "spb-h-lomonosov", e: "🧩", t: "Картины из стёклышек", s: "Михаил Ломоносов был учёным и поэтом. Он научился варить разноцветное стекло, которое называют смальтой. Чтобы получить нужные цвета, Ломоносов провёл тысячи опытов. Из маленьких кусочков смальты он с помощниками складывал картины — мозаики. Его большая мозаика о победе Петра Первого под Полтавой украшает лестницу в здании Академии наук в Петербурге.",
      q: "Из чего Ломоносов складывал мозаики?", a: ["Из кусочков цветного стекла", "Из макарон", "Из конфетных фантиков"] },
    { id: "spb-h-pavlova", e: "🦢", t: "Анна Павлова и танец лебедя", s: "Анна Павлова родилась в Петербурге. Однажды мама повела её в театр на балет «Спящая красавица», и Аня потом вспоминала, что с того дня мечтала только танцевать. Она выучилась в балетной школе и стала знаменитой балериной. Для неё поставили танец «Лебедь», и с ним она объездила весь мир. В её честь даже назвали воздушный торт из безе — «Павлова».",
      q: "Какой танец прославил Анну Павлову?", a: ["«Лебедь»", "«Пляска бегемота»", "«Танец с табуреткой»"] },
    { id: "spb-h-chajkovskij", e: "🎹", t: "Чиновник, который стал композитором", s: "Пётр Чайковский с детства любил музыку, но его отправили в Петербург учиться законам. Он окончил училище и стал чиновником, целыми днями разбирал бумаги. Но музыка не отпускала его. Когда в Петербурге открылась первая в России консерватория, Чайковский стал одним из первых её учеников. Он ушёл со службы и стал композитором, которого теперь знает весь мир.",
      q: "Где Чайковский учился музыке?", a: ["В консерватории", "В цирке у клоунов", "В пекарне"] },
    { id: "spb-h-navodnenie", e: "🌊", t: "Отметки большой воды", s: "Нева впадает в море, в Финский залив. Осенью сильный ветер с моря иногда гонит воду обратно в реку, и Нева выходит из берегов. Это называют наводнением. На стенах некоторых домов есть отметки: до этой линии когда-то поднималась вода. Самое большое наводнение было в 1824 году. Сейчас город защищает дамба в заливе: её ворота закрываются, когда идёт большая вода.",
      q: "Что сейчас защищает Петербург от наводнений?", a: ["Дамба в заливе", "Большой зонтик", "Забор из подушек"] },
    { id: "spb-h-ledohod", e: "🧊", t: "Ледоход и кубок невской воды", s: "Всю зиму Нева покрыта толстым льдом. Весной лёд трескается, ломается на льдины, и они плывут к морю. Это называется ледоход. В старину, когда река очищалась ото льда, комендант, главный начальник Петропавловской крепости, привозил царю кубок невской воды. Это был знак: река свободна, и корабли снова могут плавать.",
      q: "Что привозил царю комендант крепости весной?", a: ["Кубок невской воды", "Ведро мороженого", "Мешок снежков"] },
    { id: "spb-h-koryushka", e: "🐟", t: "Рыбка, которая пахнет огурцом", s: "Весной, когда сходит лёд, в Неву из Финского залива приплывает маленькая серебристая рыбка — корюшка. У неё удивительный запах: она пахнет свежими огурцами! Весной корюшку продают по всему городу, её жарят и едят целыми тарелками. В мае в Петербурге даже устраивают праздник корюшки. Для петербуржцев эта рыбка — настоящий знак весны.",
      q: "Чем пахнет корюшка?", a: ["Свежими огурцами", "Клубничным вареньем", "Новыми ботинками"] },
    { id: "spb-h-parusa", e: "🚢", t: "Алые паруса", s: "Каждое лето в Петербурге устраивают праздник для выпускников, которые окончили школу. Он называется «Алые паруса», а алый значит ярко-красный. Ночью по Неве плывёт корабль с алыми парусами, а в небе гремит салют. Название взяли из книги писателя Александра Грина. В ней девочка Ассоль ждала корабль с алыми парусами, и её мечта сбылась.",
      q: "Какого цвета паруса у корабля на празднике?", a: ["Алые", "Клетчатые", "Полосатые, как пижама"] },
    { id: "spb-h-krasin", e: "🛳️", t: "Ледокол «Красин» и красная палатка", s: "В 1928 году в холодной Арктике дирижабль «Италия» упал на лёд. Путешественники оказались на льдине посреди моря. Они раскрасили свою палатку красной краской, чтобы её было видно с самолётов. На помощь пошёл ледокол «Красин»: он ломал толстый лёд и пробился к людям. Ледокол спас их, а теперь стоит в Петербурге у набережной, и на него можно подняться.",
      q: "Зачем путешественники покрасили палатку в красный цвет?", a: ["Чтобы её увидели с самолётов", "Чтобы понравиться белым медведям", "Чтобы она стала вкуснее"] },
    { id: "spb-h-tramvaj", e: "🚋", t: "Трамвай на льду", s: "Давным-давно по улицам Петербурга ездила конка — вагончик, который тянули лошади. А зимой по льду Невы пустили электрический трамвай! Рельсы клали прямо на лёд, а столбы для проводов вмораживали в него. Ледовый трамвай ходил каждую зиму с 1895 по 1910 год. А по улицам города электрические трамваи поехали позже.",
      q: "Где зимой ездил трамвай в старом Петербурге?", a: ["По льду Невы", "По крышам домов", "По дну реки"] },
    { id: "spb-h-doroga", big: 1, e: "🚚", t: "Дорога жизни", s: "Во время войны враги окружили Ленинград, и город оказался в кольце. Это называют блокадой. В город почти не могли привезти еду. Зимой замёрзло большое Ладожское озеро, и по льду проложили дорогу. По ней шли грузовики с мукой и хлебом, а обратно увозили детей и больных. Люди назвали её «Дорогой жизни», потому что она спасла очень многих.",
      q: "Как назвали дорогу по льду Ладожского озера?", a: ["Дорога жизни", "Дорога пирожков", "Дорога снеговиков"] },
    { id: "spb-h-begemot", big: 1, e: "🦛", t: "Бегемотиха Красавица", s: "Во время блокады в Ленинградском зоопарке жила бегемотиха Красавица. Бегемотам нужно много воды, иначе их кожа пересыхает и трескается. А воду в зоопарк перестали подавать. Тогда смотрительница Евдокия Дашина каждый день возила на саночках сорок вёдер воды, грела её и мыла Красавицу. Бегемотиха пережила блокаду и прожила ещё много лет.",
      q: "Как звали бегемотиху из зоопарка?", a: ["Красавица", "Пузырёк", "Табуретка"] },
    { id: "spb-h-dozhd", e: "☔", t: "Город дождей", s: "Петербург стоит у моря, поэтому воздух здесь влажный, а облаков много. Дожди идут часто, и петербуржцы привыкли носить с собой зонтик. Погода меняется быстро: утром светит солнце, а днём уже моросит дождик. Зато после дождя мокрые улицы блестят, а в лужах отражаются дома и фонари. Солнечный день здесь — маленький праздник, и все сразу идут гулять.",
      q: "Что петербуржцы привыкли носить с собой?", a: ["Зонтик", "Ласты", "Сковородку"] },
    { id: "spb-h-chajki", e: "🐦", t: "Чайки на крышах", s: "Петербург стоит у моря, поэтому в городе живёт много чаек. Они вьют гнёзда прямо на крышах домов и громко кричат по утрам. А ещё здесь много серых ворон: они серые, а голова, крылья и хвост у них чёрные. Вороны очень умные и прячут еду про запас. Иногда можно увидеть, как чайка и ворона спорят из-за кусочка булки.",
      q: "Где чайки в Петербурге вьют гнёзда?", a: ["На крышах домов", "В трамваях", "В карманах у прохожих"] },
    { id: "spb-h-dvor", e: "🏘️", t: "Двор-колодец", s: "В старом Петербурге дома стоят тесно, плечом к плечу. Внутри прячутся дворы, со всех сторон окружённые высокими стенами. Если встать посередине и посмотреть вверх, небо кажется маленьким квадратиком, как будто смотришь со дна колодца. Поэтому такие дворы и называют дворами-колодцами. Через некоторые дворы можно пройти с одной улицы на другую.",
      q: "Почему такие дворы называют колодцами?", a: ["Небо видно маленьким, как из колодца", "Там живут водяные", "Там все пьют из ведра"] },
    { id: "spb-h-slova", e: "🗣️", t: "Поребрик и парадная", s: "В Петербурге некоторые вещи называют по-своему. Каменный край тротуара здесь зовут поребриком, а в Москве — бордюром. Вход в дом с лестницей петербуржцы называют парадной, а не подъездом. Белый хлеб тут просто булка, а шаурму называют шавермой. По таким словам сразу можно узнать петербуржца.",
      q: "Как в Петербурге называют край тротуара?", a: ["Поребрик", "Поросёнок", "Попрыгунчик"] },
    { id: "spb-h-pyshki", e: "🍩", t: "Пышки с сахарной пудрой", s: "В Петербурге очень любят пышки. Это мягкие колечки из теста, которые жарят в горячем масле. Сверху их густо посыпают сахарной пудрой, так что легко испачкать нос. В Москве похожие колечки называют пончиками, а в Петербурге — только пышками. Есть пышечные, где их жарят уже много лет и подают с какао или сладким кофе с молоком.",
      q: "Чем посыпают петербургские пышки?", a: ["Сахарной пудрой", "Солью и перцем", "Конфетти"] },
    { id: "spb-rusmuseum", e: "🖼️", t: "Музей в жёлтом дворце", s: "В центре Петербурга стоит жёлто-белый Михайловский дворец. В нём находится Русский музей, где собраны картины только русских художников. Музей открылся в 1898 году. Здесь висит «Девятый вал» Айвазовского с огромной морской волной и «Последний день Помпеи» Брюллова. Перед дворцом есть сквер с памятником Пушкину, который читает стихи, подняв руку.",
      q: "Картины каких художников собраны в Русском музее?", a: ["Русских художников", "Только котов-художников", "Художников с Луны"] },
    { id: "spb-engineers-castle", e: "🏯", t: "Замок со рвами", s: "Император Павел Первый мечтал жить в настоящей крепости. Для него построили Михайловский замок, а вокруг вырыли рвы с водой. Попасть внутрь можно было только по подъёмным мостам. Позже в замке открыли училище для будущих инженеров, и его стали звать Инженерным. А совсем рядом, у Фонтанки, сидит маленький бронзовый Чижик-пыжик.",
      q: "Как можно было попасть в замок?", a: ["По подъёмным мостам", "На воздушном шаре", "Через печную трубу"] }
  ] },
  pt: { name: 'Португалия и Кашкайш', e: '⛵', bg: 'var(--t-mint)', items: [
    { id: 'pt-king', e: '👑', t: 'Как Кашкайш стал королевским', s: 'Кашкайш был маленькой рыбацкой деревней. Однажды король Португалии Луиш Первый выбрал его для летнего отдыха у моря. Королевская семья жила в старой крепости — Цитадели. За королём сюда потянулись знатные гости. Так рыбацкая деревня стала знаменитым курортом.',
      q: 'Кто выбрал Кашкайш для летнего отдыха?', a: ['Король', 'Пират', 'Кит'] },
    { id: 'pt-light', e: '💡', t: 'Первый электрический свет', s: 'В 1878 году в Кашкайше зажёгся первый в Португалии электрический свет. Его устроили в Цитадели на день рождения принца Карлуша. Представь: вокруг только свечи и масляные лампы, а тут — яркий электрический свет! Все, кто это видел, очень удивились.',
      q: 'Где в Португалии впервые зажёгся электрический свет?', a: ['В Кашкайше', 'На корабле', 'В пещере'] },
    { id: 'pt-boca', e: '🌊', t: 'Пасть ада', s: 'Рядом с Кашкайшем есть скалы с огромной пещерой и аркой. Это место называют Бока-ду-Инферну, что значит «Пасть ада». Звучит страшно, но там очень красиво. В шторм волны залетают в пещеру, грохочут и взлетают брызгами вверх. Кажется, будто рычит огромное чудище.',
      q: 'Что грохочет в Пасти ада?', a: ['Волны', 'Поезд', 'Пушка'] },
    { id: 'pt-farol', e: '⚓', t: 'Полосатый маяк', s: 'В Кашкайше у самой воды стоит маяк Санта-Марта. Он белый с синими полосками, как матросская тельняшка. Ночью маяк светит кораблям, чтобы они не наткнулись на скалы. А внутри маяка теперь музей, где рассказывают о маяках Португалии.',
      q: 'Какие полоски у маяка Санта-Марта?', a: ['Синие', 'Красные', 'Зелёные'] },
    { id: 'pt-roca', e: '🧭', t: 'Где кончается земля', s: 'Мыс Рока — самая западная точка материковой Европы. Дальше только океан, до самой Америки. Высокие скалы обрываются прямо в волны. Португальский поэт Луиш де Камоэнс написал о таком месте: «Здесь кончается земля и начинается море». Эти слова высечены на памятнике на мысе.',
      q: 'Что начинается за мысом Рока?', a: ['Океан', 'Пустыня', 'Горы'] },
    { id: 'pt-pena', e: '🏰', t: 'Разноцветный дворец Пена', s: 'В горах Синтры, на самой вершине, стоит дворец Пена. Он похож на дворец из сказки: жёлтые и красные башенки, зубчатые стены. Его построил король Фердинанд Второй, который очень любил искусство. Вокруг — огромный парк с озёрами, гротами и деревьями со всего мира. В туман кажется, что дворец плывёт в облаках.',
      q: 'Какого цвета башни дворца Пена?', a: ['Жёлтые и красные', 'Чёрные', 'Прозрачные'] },
    { id: 'pt-belem', e: '🦏', t: 'Башня Белен и носорог', s: 'В Лиссабоне у реки Тежу стоит каменная башня Белен. Ей пятьсот лет. Отсюда моряки уплывали в далёкие страны. Если присмотреться, на башне можно найти каменную голову носорога. Однажды в Лиссабон привезли из Индии настоящего носорога, и его запомнили навсегда!',
      q: 'Какое животное спрятано на башне Белен?', a: ['Носорог', 'Пингвин', 'Кенгуру'] },
    { id: 'pt-gama', e: '⛵', t: 'Васко да Гама и путь в Индию', s: 'Давным-давно люди искали морской путь в Индию за пряностями: перцем, корицей и гвоздикой. В 1497 году мореплаватель Васко да Гама отправился из Лиссабона на кораблях вокруг всей Африки. Путь был долгим и опасным. Но в 1498 году он доплыл до Индии! Так Португалия стала страной великих мореплавателей.',
      q: 'Куда доплыл Васко да Гама?', a: ['До Индии', 'До Антарктиды', 'До Луны'] },
    { id: 'pt-azulejo', e: '🟦', t: 'Азулежу — картины из плитки', s: 'В Португалии многие дома украшены расписной плиткой. Она называется азулежу. Чаще всего плитка бело-синяя, но бывает и разноцветная. Из маленьких квадратиков складывают целые картины: корабли, цветы и сцены из жизни. А ещё плитка защищает стены от жары и сырости.',
      q: 'Как называется португальская расписная плитка?', a: ['Азулежу', 'Мозаичка', 'Пастила'] },
    { id: 'pt-tram', e: '🚋', t: 'Жёлтый трамвай номер 28', s: 'По узким улочкам Лиссабона ездит старенький жёлтый трамвай номер 28. Лиссабон стоит на холмах, и трамвай лихо карабкается вверх и катится вниз. Улицы такие узкие, что кажется, будто трамвай вот-вот заденет дома. А трамвай звенит: дзинь-дзинь!',
      q: 'Какого цвета трамвай номер 28?', a: ['Жёлтый', 'Фиолетовый', 'Полосатый'] },
    { id: 'pt-ocean', e: '🐠', t: 'Океанариум Лиссабона', s: 'В Лиссабоне есть один из самых больших океанариумов Европы. В середине — огромный аквариум, как кусочек открытого океана. Там плавают акулы, скаты и смешная рыба-луна. А ещё там живут морские выдры: они любят плавать на спине.',
      q: 'Кто любит плавать на спине?', a: ['Морские выдры', 'Акулы', 'Скаты'] },
    { id: 'pt-nata', e: '🥧', t: 'Пирожное паштел-де-ната', s: 'Самое знаменитое португальское пирожное — паштел-де-ната: хрустящая корзиночка с нежным заварным кремом. Его придумали монахи монастыря в районе Белен. Когда монастырь закрыли, рецепт продали соседней кондитерской. Там пирожные пекут до сих пор, а секретный рецепт знают всего несколько человек.',
      q: 'Кто придумал паштел-де-ната?', a: ['Монахи', 'Моряки', 'Пингвины'] },
    // more stories (2026-10)
    { id: "pt-regaleira", e: "🌀", t: "Колодец-спираль", s: "В Синтре, в старинном саду Кинта да Регалейра, есть необычный колодец. Воды в нём нет, зато вниз по кругу вьётся каменная лестница. Колодец глубокий, примерно как девятиэтажный дом, и похож на башню, которую перевернули вверх ногами. Со дна видно маленький круг неба. А от дна уходят подземные ходы к гротам и к озеру с водопадом.",
      q: "На что похож колодец в Кинта да Регалейра?", a: ["На перевёрнутую башню", "На огромную кастрюлю", "На спящего кита"] },
    { id: "pt-mouros", e: "⛰️", t: "Каменная змея на горе", s: "Над Синтрой, на вершине горы, стоят стены Мавританского замка. Его построили мавры больше тысячи лет назад. Стены с зубцами бегут по скалам то вверх, то вниз, словно длинная каменная змея. По ним можно пройти и подняться на башни. Сверху видно разноцветный дворец Пена, город Синтру, а в ясный день даже океан.",
      q: "На что похожи стены Мавританского замка?", a: ["На длинную каменную змею", "На варёные макароны", "На радугу"] },
    { id: "pt-monserrate", e: "🌴", t: "Сад со всего света", s: "Недалеко от Синтры есть парк Монсеррат. Больше ста пятидесяти лет назад один англичанин решил собрать здесь растения со всего света. Теперь тут растут пальмы, высоченные секвойи из Америки и папоротники ростом с дерево. Посреди парка стоит дворец с куполами и каменными кружевами, похожий на сказочный. Гулять здесь — как побывать в разных странах за один день.",
      q: "Откуда привезли растения в парк Монсеррат?", a: ["Со всего света", "С соседнего огорода", "С Луны"] },
    { id: "pt-guincho", e: "🪁", t: "Ветреный пляж Гиншу", s: "Недалеко от центра Кашкайша есть большой пляж Гиншу. Здесь часто дует сильный ветер с океана. Поэтому сюда приезжают кайтсёрферы: ветер тянет их большой воздушный змей, и они мчатся по волнам на доске. Ветер переносит и песок, из него вырастают песчаные холмы — дюны. По дюнам проложена деревянная дорожка, чтобы гулять и не топтать растения.",
      q: "Что тянет кайтсёрфера по волнам?", a: ["Большой воздушный змей", "Дрессированный дельфин", "Моторчик в кармане"] },
    { id: "pt-pescadores", e: "🎣", t: "Рыбацкий пляж", s: "В самом центре Кашкайша есть маленький пляж, его называют Рыбацким. Когда-то Кашкайш был рыбацкой деревней, и рыбаки живут здесь до сих пор. Их лодки качаются в бухте, а на берегу рыбаки чинят сети. Свежую рыбу везут на рынок, где её покупают жители и повара. На этом пляже можно рассмотреть разноцветные лодки и сложенные сети.",
      q: "Что рыбаки делают на берегу?", a: ["Чинят сети", "Пекут торты", "Учат чаек плавать"] },
    { id: "pt-carmona", e: "🦚", t: "Павлины в парке", s: "В Кашкайше есть парк Маречал Кармона. По его дорожкам свободно гуляют павлины, курицы и петухи. Павлин может вдруг раскрыть хвост, как огромный веер с глазками. В пруду плавают утки, а на камнях греются на солнце черепахи. Птицы совсем не боятся людей, поэтому их можно рассмотреть очень близко.",
      q: "Что делают черепахи в парке?", a: ["Греются на камнях", "Играют в футбол", "Катаются на павлинах"] },
    { id: "pt-nazare", big: 1, e: "🌊", t: "Самые большие волны", s: "В городке Назаре зимой бывают самые большие волны, на которых катаются люди. Некоторые из них высотой с многоэтажный дом! Всё дело в огромном ущелье на дне океана: оно помогает волнам вырасти. Смелые сёрферы мчатся по таким волнам, а зрители смотрят на них с высокой скалы. Там стоит маленькая крепость с красным маяком на крыше.",
      q: "Что помогает волнам в Назаре стать такими большими?", a: ["Ущелье на дне океана", "Подводный вентилятор", "Киты, которые машут хвостами"] },
    { id: "pt-obidos", e: "🎁", t: "Город в подарок", s: "Обидуш — маленький город, который окружён высокой каменной стеной. Давным-давно король Диниш подарил этот город на свадьбу своей невесте Изабелле. Потом Обидуш много лет дарили португальским королевам. По верху стены можно обойти почти весь город и посмотреть на белые домики с цветами. Только крепко держись за руку взрослого: перил там нет.",
      q: "Что король подарил невесте на свадьбу?", a: ["Целый город", "Ведро клубники", "Говорящего попугая"] },
    { id: "pt-mafra", e: "🦇", t: "Сторожа в библиотеке", s: "В городе Мафра стоит огромный дворец, а в нём — старинная библиотека с десятками тысяч книг. По ночам здесь летают необычные сторожа — летучие мыши. Они ловят жучков и мотыльков, которые могли бы испортить старые страницы. Вечером работники накрывают столы покрывалами, а утром моют пол. Так маленькие помощники берегут книги.",
      q: "Кого ловят летучие мыши в библиотеке?", a: ["Жучков и мотыльков", "Буквы из книг", "Конфетные фантики"] },
    { id: "pt-ponte-porto", big: 1, e: "🌉", t: "Двухэтажный мост", s: "В городе Порту через реку Дору перекинут железный мост Луиша Первого. Он двухэтажный! По верхнему этажу едет метро и ходят люди, а по нижнему едут машины и тоже идут пешеходы. Придумал мост инженер, который раньше работал вместе с Густавом Эйфелем, создателем знаменитой башни в Париже. С верхнего этажа видно весь старый город и лодки на реке.",
      q: "Что ездит по верхнему этажу моста?", a: ["Метро", "Паровоз с жирафами", "Карусель"] },
    { id: "pt-rabelo", e: "⛵", t: "Лодки рабелу", s: "По реке Дору раньше плавали деревянные лодки рабелу. У них плоское дно, большой квадратный парус и очень длинное весло сзади, чтобы поворачивать. На этих лодках возили вниз по реке тяжёлые бочки из долины, где растёт виноград. Теперь рабелу стоят у берега, прямо напротив старого Порту. А летом, в праздник Святого Иоанна, на них устраивают гонки.",
      q: "Зачем лодке рабелу длинное весло сзади?", a: ["Чтобы поворачивать", "Чтобы чесать спину", "Чтобы ловить облака"] },
    { id: "pt-coimbra", e: "🔔", t: "Колокол по имени Коза", s: "В городе Коимбра есть один из самых старых университетов в мире. Он стоит на вершине холма, а над ним поднимается башня с часами и колоколом. Студенты в шутку прозвали этот колокол «Коза». Его звон звал студентов на занятия. А многие студенты здесь до сих пор носят длинные чёрные плащи, как в старинной сказке.",
      q: "Как студенты прозвали колокол?", a: ["«Коза»", "«Бегемот»", "«Пирожок»"] },
    { id: "pt-moliceiro", e: "🎨", t: "Расписные лодки", s: "Город Авейру стоит у воды, и по его каналам плавают длинные лодки молисейру. Раньше на них собирали со дна лагуны водоросли и подводную траву, чтобы удобрять поля. Нос и корма у этих лодок расписаны яркими картинками. Часто это смешные сценки с подписями. Теперь на молисейру катают гостей города, и картинки можно разглядывать прямо в пути.",
      q: "Что раньше собирали на лодках молисейру?", a: ["Водоросли", "Мороженое", "Упавшие звёзды"] },
    { id: "pt-evora", big: 1, e: "🏛️", t: "Храм римлян", s: "В центре города Эвора стоят высокие каменные колонны старинного храма. Его построили римляне почти две тысячи лет назад, когда эта земля была частью их огромного государства. Сами колонны из гранита, а их резные верхушки — из белого мрамора. Храм часто называют храмом Дианы, богини охоты, но точно никто не знает, кому он был посвящён.",
      q: "Кто построил храм в Эворе?", a: ["Римляне", "Динозавры", "Бобры"] },
    { id: "pt-benagil", e: "🛶", t: "Пещера с окошком", s: "На юге Португалии, в Алгарве, есть пещера Бенагил. Её выточило море в золотистой скале. В потолке пещеры — круглая дыра, как окошко, и через неё внутрь падает солнечный луч. Пешком туда не попасть: к пещере подплывают по морю на лодках и каяках. А сверху, со скалы, можно заглянуть в это окошко и увидеть внизу песок и воду.",
      q: "Что есть в потолке пещеры Бенагил?", a: ["Круглое окошко", "Люстра с конфетами", "Дверной звонок"] },
    { id: "pt-levadas", e: "💧", t: "Водяные тропинки", s: "На острове Мадейра на севере идёт много дождей, а на юге мало. Поэтому люди давным-давно начали вырубать в горах узкие каналы — левады. По ним вода бежит с дождливой стороны острова к полям и садам. Вдоль левад идут тропинки, и теперь по ним гуляют путешественники. Тропинка ведёт через лес с мхами и папоротниками, а рядом журчит вода.",
      q: "Что бежит по левадам?", a: ["Вода", "Лимонад", "Ёжики"] },
    { id: "pt-sete-cidades", e: "🌋", t: "Синее и зелёное озеро", s: "На Азорских островах есть огромная чаша, которая осталась от древнего вулкана. Это место называется Сете-Сидадеш. В чаше лежат два озера, одно кажется синим, а другое зелёным, и между ними проходит мостик. По легенде, озёра наплакали принцесса и пастух, у которых были глаза разного цвета. А учёные объясняют цвет глубиной воды и тем, что в ней растёт.",
      q: "Какого цвета озёра в Сете-Сидадеш?", a: ["Синее и зелёное", "Красное и в клеточку", "Шоколадное и ванильное"] },
    { id: "pt-baleias", e: "🐋", t: "Вышки для китов", s: "У Азорских островов в океане живёт много китов и дельфинов. Кашалоты, огромные киты с большой квадратной головой, встречаются здесь круглый год. На берегу стоят маленькие каменные домики-вышки. Когда-то их строили для охоты на китов, но охоту давно запретили. Теперь наблюдатели высматривают оттуда в бинокль фонтаны над водой и подсказывают лодкам с туристами, куда плыть.",
      q: "Что ищут наблюдатели с вышек?", a: ["Китов", "Потерянные тапочки", "Летающие тарелки"] },
    { id: "pt-cegonhas", e: "🪺", t: "Аисты на столбах", s: "В Алентежу, на юге Португалии, живёт очень много белых аистов. Они строят огромные гнёзда из веток на столбах, трубах и колокольнях. Многие аисты теперь не улетают на зиму в Африку, а остаются в Португалии. А на берегу океана аисты устраивают гнёзда прямо на скалах над волнами. Такое почти нигде в мире больше не увидишь.",
      q: "Где аисты строят гнёзда?", a: ["На столбах и колокольнях", "В холодильниках", "В карманах у рыбаков"] },
    { id: "pt-cortica", e: "🌳", t: "Дерево в пробковой шубе", s: "В Португалии растёт пробковый дуб, у него очень толстая и мягкая кора. Раз в девять лет люди аккуратно снимают с дерева часть коры, а само дерево продолжает расти. Потом на стволе пишут краской последнюю цифру года, чтобы помнить, когда кору снимали. Из коры делают пробки, коврики и даже обувь. Пробки в Португалии собирают больше, чем в любой другой стране.",
      q: "Как часто снимают кору с пробкового дуба?", a: ["Раз в девять лет", "Каждое утро", "Раз в тысячу лет"] },
    { id: "pt-santa-justa", e: "🛗", t: "Лифт на соседний холм", s: "Лиссабон стоит на холмах, и подниматься по крутым улицам нелегко. Поэтому больше ста лет назад в центре города построили лифт Санта-Жушта. Это высокая железная башня с узорами, похожими на кружево. Лифт поднимает людей с нижней улицы наверх, к мостику на соседний холм. Сначала он работал на паровой машине, а потом на электричестве.",
      q: "На чём сначала работал лифт Санта-Жушта?", a: ["На паровой машине", "На педалях", "На мыльных пузырях"] },
    { id: "pt-ponte-abril", e: "🎵", t: "Поющий мост", s: "Через реку Тежу в Лиссабоне протянулся длинный красный мост Двадцать пятого апреля. Он очень похож на знаменитый мост Золотые Ворота в Америке. Наверху едут машины, а внизу поезда. Когда машины катятся по железной решётке моста, слышен гул, будто мост поёт. А на другом берегу стоит большая статуя Христа с раскинутыми руками, Кришту-Рей, и к ней можно подняться на лифте.",
      q: "Что слышно, когда машины едут по мосту?", a: ["Гул, будто мост поёт", "Мяуканье котят", "Кукареканье"] },
    { id: "pt-sao-jorge", e: "🏰", t: "Волшебная камера в замке", s: "На холме в старом центре Лиссабона стоит замок Святого Георгия. По его садам свободно разгуливают павлины. В одной из башен есть тёмная комната с волшебной камерой. Зеркала и стёкла показывают на большой чаше весь город прямо сейчас: машины, корабли на реке и людей на улицах. А со стен замка видно реку Тежу и красные крыши домов.",
      q: "Кто гуляет по садам замка?", a: ["Павлины", "Пингвины", "Жирафы"] },
    { id: "pt-jeronimos", big: 1, e: "🐚", t: "Каменные верёвки и ракушки", s: "В районе Белен в Лиссабоне стоит огромный светлый монастырь Жеронимуш. Его начали строить, когда португальские мореплаватели открывали дальние морские пути. Поэтому на его стенах вырезаны из камня морские верёвки, узлы и ракушки. Во внутреннем дворике колонны покрыты тонкими узорами, как кружевом. Кажется, что камень стал мягким, как тесто.",
      q: "Что вырезано на стенах монастыря?", a: ["Верёвки и ракушки", "Велосипеды", "Роботы"] },
    { id: "pt-golfinhos", e: "🐬", t: "Дельфины реки Саду", s: "Недалеко от Лиссабона, у города Сетубал, в океан впадает река Саду. Там круглый год живёт стая дельфинов-афалин. Их всего несколько десятков, и учёные узнают каждого по форме спинного плавника. В Европе такие стаи, которые живут на одном месте, встречаются очень редко. С лодки можно увидеть, как дельфины выныривают, чтобы вдохнуть воздух.",
      q: "Как учёные узнают каждого дельфина?", a: ["По спинному плавнику", "По шапочке", "По номеру на хвосте"] },
    { id: "pt-c-henrique", e: "⛵", t: "Генрих Мореплаватель", s: "Принца Генриха прозвали Мореплавателем, хотя сам он в дальние плавания не ходил. Зато он отправлял корабли всё дальше на юг, вдоль берегов Африки. Для этого строили каравеллы — лёгкие суда с треугольными парусами. Они умели идти зигзагом даже против ветра. Моряки боялись мыса Бохадор, про него ходили страшные сказки. Но в 1434 году капитан Жил Эанеш обогнул этот мыс, и путь на юг открылся.",
      q: "Какие паруса были у каравелл?", a: ["Треугольные", "Круглые, как блины", "В форме сердечка"] },
    { id: "pt-c-dias", e: "🧭", t: "Мыс Доброй Надежды", s: "В 1488 году капитан Бартоломеу Диаш повёл корабли на юг вдоль Африки. Сильная буря много дней уносила их в открытый океан. Когда ветер стих, Диаш понял, что уже обогнул южный край Африки! На обратном пути моряки увидели высокий скалистый мыс. Его назвали мысом Доброй Надежды: появилась надежда доплыть вокруг Африки до Индии.",
      q: "Как назвали мыс, который увидели моряки Диаша?", a: ["Мыс Доброй Надежды", "Мыс Вкусной Каши", "Мыс Сонной Черепахи"] },
    { id: "pt-c-magellan", e: "🌍", t: "Вокруг света", s: "Фернан Магеллан родился в Португалии, а корабли для плавания ему дал испанский король. В 1519 году пять кораблей Магеллана поплыли на запад. У Южной Америки он нашёл узкий пролив, теперь его зовут Магеллановым. За проливом океан был спокойным, и Магеллан назвал его Тихим. Через три года один корабль, «Виктория», вернулся домой. Так люди впервые обошли вокруг всей Земли.",
      q: "Как Магеллан назвал спокойный океан?", a: ["Тихий", "Сонный", "Ворчливый"] },
    { id: "pt-c-afonso", e: "👑", t: "Первый король", s: "Первым королём Португалии стал Афонсу Энрикеш. Он был храбрым воином, и его прозвали Завоевателем. В 1143 году соседний король признал его королём, и Португалия стала отдельным королевством. В городе Гимарайнш на старой стене написано: «Здесь родилась Португалия». А границы страны почти не меняются уже больше семисот лет.",
      q: "Как прозвали короля Афонсу Энрикеша?", a: ["Завоеватель", "Соня", "Пирожок"] },
    { id: "pt-c-romans", e: "🏛️", t: "Когда здесь жили римляне", s: "Две тысячи лет назад этой землёй правили древние римляне. Они называли её Лузитанией, а Лиссабон — Олисипо. Римляне строили дороги, мосты и дома с полами из цветной мозаики. В городе Эвора до сих пор стоят колонны римского храма. А португальский язык вырос из латыни — языка римлян.",
      q: "Как римляне называли Лиссабон?", a: ["Олисипо", "Макаронипо", "Бутербродия"] },
    { id: "pt-c-arabic-words", e: "🫒", t: "Слова, которые оставили мавры", s: "Много веков назад на юге Португалии жили мавры — арабы и берберы из Северной Африки. Они оставили в португальском языке сотни слов. «Азейте» — оливковое масло, «арош» — рис, «асукар» — сахар: все эти слова пришли из арабского. Название Алгарве тоже арабское, оно значит «запад». А если португалец говорит «ошала», он надеется, что что-то сбудется.",
      q: "Что значит название Алгарве?", a: ["Запад", "Пирожок", "Крокодил"] },
    { id: "pt-c-earthquake", big: 1, e: "🏚️", t: "Город, который построили заново", s: "Первого ноября 1755 года в Лиссабоне случилось страшное землетрясение. Многие дома рухнули, потом с моря пришла огромная волна, а в городе начались пожары. Восстановлением руководил министр, которого позже сделали маркизом Помбалом. Новые улицы сделали прямыми и широкими. А в стены домов прятали деревянный каркас, чтобы при новых толчках дома не падали.",
      q: "Что прятали в стены новых домов?", a: ["Деревянный каркас", "Мешки с конфетами", "Резиновых уточек"] },
    { id: "pt-c-pombal", e: "🦁", t: "Улица Золота и улица Серебра", s: "После большого землетрясения маркиз Помбал отстроил центр Лиссабона заново. Улицы он сделал прямыми и многие отдал разным мастерам. Так появились улица Золота, улица Серебра и улица Сапожников. Эти названия сохранились до сих пор. А сам маркиз стоит на высокой колонне на площади, названной в его честь, и рядом с ним лев.",
      q: "Кто стоит рядом с маркизом Помбалом на колонне?", a: ["Лев", "Жираф", "Кенгуру"] },
    { id: "pt-c-camoes", e: "📜", t: "Поэт, который спас свою книгу", s: "Луис де Камоэнс — самый известный поэт Португалии. В молодости он был солдатом и в бою потерял глаз. Он написал длинную поэму «Лузиады» о португальских мореплавателях. Рассказывают, что однажды его корабль разбился, и Камоэнс плыл к берегу, держа рукопись над водой. А десятого июня, в День Португалии, вспоминают и Камоэнса.",
      q: "Что спасал Камоэнс, когда плыл к берегу?", a: ["Свою поэму", "Свой бутерброд", "Свою шляпу с пером"] },
    { id: "pt-c-carnations", big: 1, e: "💐", t: "Революция гвоздик", s: "Долгие годы в Португалии правили строгие правители, и люди не могли свободно говорить, что думают. Двадцать пятого апреля 1974 года военные вышли на улицы Лиссабона, чтобы это изменить. Одна женщина подарила солдату красную гвоздику, и он вставил цветок в ствол винтовки. Другие сделали так же. Стрельбы почти не было, а этот день теперь праздник свободы.",
      q: "Какие цветы стали символом этого дня?", a: ["Красные гвоздики", "Синие ромашки", "Фиолетовые кактусы"] },
    { id: "pt-c-brazil", e: "🪵", t: "Как Бразилия получила имя", s: "В 1500 году мореплаватель Педру Алвареш Кабрал приплыл к берегам Бразилии. Там росло дерево с древесиной, красной, как угольки, — по-португальски «пау-бразил». От него и пошло название страны. Сегодня в Бразилии по-португальски говорят намного больше людей, чем в самой Португалии. А ещё на этом языке говорят в Анголе, Мозамбике и других странах.",
      q: "В честь чего назвали Бразилию?", a: ["В честь дерева с красной древесиной", "В честь кота капитана", "В честь любимого пирожка короля"] },
    { id: "pt-c-obrigado", e: "💬", t: "Обригаду и обригада", s: "По-португальски «спасибо» мальчики и девочки говорят по-разному. Мальчик скажет «обригаду», а девочка скажет «обригада». Это слово значит примерно «я вам обязан». До обеда португальцы здороваются: «Бон диа!» А вечером говорят: «Боа нойте!» Попробуй сказать так в кафе или в магазине.",
      q: "Как скажет «спасибо» девочка?", a: ["Обригада", "Кукарекада", "Шоколада"] },
    { id: "pt-c-orange", e: "🍊", t: "Апельсин-португалец", s: "Сладкие апельсины привезли в Европу из Азии португальские моряки. Поэтому во многих странах апельсин назвали в честь Португалии. По-гречески он «портокали», по-турецки «портакал», а по-болгарски «портокал». А русское слово «апельсин» значит «китайское яблоко». Сами же португальцы зовут апельсин «ларанжа».",
      q: "Что значит русское слово «апельсин»?", a: ["Китайское яблоко", "Летающая морковка", "Круглый огурец"] },
    { id: "pt-c-calcada", e: "🪨", t: "Каменные ковры", s: "Тротуары в Португалии часто выложены маленькими камешками — белыми и чёрными. Это калсада, португальская мостовая. Мастера укладывают каждый камешек вручную и подбивают молотком. Из камней получаются волны, кораблики и цветы. На площади Россиу в Лиссабоне камни лежат волнами, как море. Такие же волны потом выложили на знаменитом пляже Копакабана в Бразилии.",
      q: "Какого цвета камешки калсады?", a: ["Белые и чёрные", "Розовые в полоску", "Золотые и шоколадные"] },
    { id: "pt-c-galo", e: "🐓", t: "Петушок из Барселуша", s: "Есть старая легенда про город Барселуш. Однажды там обвинили путника в краже, которой он не совершал. Судья в это время обедал жареным петухом. Путник сказал: «Если я не виноват, этот петух встанет и закукарекает!» И петух вскочил и громко закричал «кукареку». Путника отпустили, а расписной петушок стал символом Португалии.",
      q: "Что сделал жареный петух?", a: ["Встал и закукарекал", "Спел песню про сосиски", "Улетел на Луну"] },
    { id: "pt-c-santo-antonio", e: "🎉", t: "Праздник Святого Антония", s: "Святой Антоний родился в Лиссабоне, и в июне город весело празднует его день. В ночь на тринадцатое июня на улицах жарят сардины и едят их на кусочке хлеба. Повсюду гирлянды, музыка и танцы. Люди дарят друг другу базилик в горшочке с бумажным цветком и коротким стишком. А по главной улице идут нарядные шествия от разных районов города.",
      q: "Что жарят на улицах в праздник Святого Антония?", a: ["Сардины", "Мороженое", "Арбузные корки"] },
    { id: "pt-c-bacalhau", e: "🐟", t: "Бакальяу — верный друг", s: "Бакальяу — это сушёная солёная треска. Её ловят далеко на севере, в холодных морях, а потом солят и сушат, чтобы она долго не портилась. Перед готовкой рыбу вымачивают в воде день или два. Португальцы говорят, что рецептов бакальяу больше, чем дней в году, и ласково зовут её «верным другом». В Сочельник многие семьи едят бакальяу с картошкой и капустой.",
      q: "Где ловят треску для бакальяу?", a: ["В холодных северных морях", "В бабушкиной ванне", "В лимонадном озере"] },
    { id: "pt-c-water-dog", e: "🐕", t: "Собака-рыбак", s: "Португальская водяная собака — настоящий помощник рыбаков. У неё кудрявая шерсть и перепонки между пальцами, как у утки. Раньше такие собаки ныряли за упавшими в воду сетями и рыбой. Они даже переплывали от лодки к лодке и к берегу с записками. Однажды эта порода чуть не исчезла, но её спасли любители собак. Такие собаки жили даже у американского президента.",
      q: "Что есть у водяной собаки между пальцами?", a: ["Перепонки, как у утки", "Колокольчики", "Конфеты"] },
    { id: "pt-c-lusitano", e: "🐎", t: "Лошади — дети ветра", s: "Лузитанские лошади — старинная порода Португалии. Их назвали в честь Лузитании, так эту землю звали древние римляне. Римляне восхищались здешними быстрыми лошадьми. Они даже рассказывали сказку, будто жеребята здесь — дети западного ветра. Лузитанцы смелые, спокойные и очень ловкие. Под музыку они умеют делать красивые шаги, словно танцуют.",
      q: "Чьими детьми римляне в сказке называли этих лошадей?", a: ["Детьми ветра", "Детьми табуретки", "Детьми пылесоса"] },
    { id: "pt-c-eusebio", e: "⚽", t: "Чёрная пантера", s: "Эйсебио родился в Африке, в Мозамбике, и с детства гонял мяч по улицам. Потом он приехал в Лиссабон и стал одним из лучших футболистов мира. За скорость и ловкость его прозвали «Чёрной пантерой». В 1965 году он получил «Золотой мяч» — приз лучшему футболисту Европы. А на чемпионате мира 1966 года Эйсебио забил больше всех голов.",
      q: "Как прозвали Эйсебио?", a: ["Чёрная пантера", "Розовый слонёнок", "Сонный ёжик"] },
    { id: "pt-c-ronaldo", e: "🏆", t: "Мальчик с Мадейры", s: "Криштиану Роналду родился в 1985 году на острове Мадейра, в городе Фуншал. В двенадцать лет он один уехал с острова в Лиссабон, чтобы учиться футболу. Он очень скучал по дому, но не бросил тренировки. В 2016 году сборная Португалии с Роналду стала чемпионом Европы. А аэропорт Мадейры теперь носит его имя.",
      q: "Где родился Криштиану Роналду?", a: ["На острове Мадейра", "На северном полюсе у моржей", "На крыше автобуса"] },
    { id: "pt-c-carnival", e: "🎭", t: "Карнавал", s: "В конце зимы, перед Великим постом, в Португалии празднуют карнавал. Дети приходят в школу в костюмах, а по улицам идут весёлые шествия. В городе Торреш-Ведраш мужчины наряжаются в платья и парики. А в деревне Поденсе бегают ряженые в масках и лохматых костюмах из ярких ниток. На поясе у них звенят колокольчики, и так они шумно провожают зиму.",
      q: "Что звенит на поясе у ряженых в Поденсе?", a: ["Колокольчики", "Кастрюльки с супом", "Будильники"] },
    { id: "pt-c-bolo-rei", e: "🎄", t: "Королевский пирог", s: "На Рождество в Португалии пекут боло-рей — «королевский пирог». Он круглый, с дыркой посередине, как корона. Сверху его украшают засахаренными фруктами и орехами, словно драгоценными камнями. По старой традиции в пирог прятали сухой боб: кому он попадётся, тот покупает пирог в следующем году. Боло-рей едят до шестого января, Дня Королей.",
      q: "Что должен сделать тот, кому попался боб?", a: ["Купить пирог в следующем году", "Прокукарекать три раза", "Съесть боб с горчицей"] },
    { id: "pt-c-chestnuts", e: "🌰", t: "Каштаны и лето Святого Мартина", s: "Осенью на улицах Португалии пахнет жареными каштанами. Продавцы жарят их прямо на тележках, и над ними вьётся белый дым. Одиннадцатого ноября, в день Святого Мартина, семьи и школы устраивают праздник каштанов. По легенде, Мартин отдал половину плаща замёрзшему бедняку, и тут выглянуло солнце. Поэтому тёплые дни в ноябре зовут «летом Святого Мартина».",
      q: "Что Мартин отдал бедняку?", a: ["Половину плаща", "Половину торта", "Свой зонтик в цветочек"] },
    { id: "pt-espichel", e: "🦕", t: "Следы динозавров на скале", s: "Недалеко от Лиссабона есть мыс Эшпишел с высокими скалами над океаном. На одной скале видны огромные круглые ямки, которые цепочкой поднимаются вверх. Это следы динозавров, которые прошли здесь миллионы лет назад, когда камень был мягким илом. Раньше люди думали, что это следы огромного мула из старой легенды. А учёные выяснили: здесь гуляли длинношеие травоядные динозавры.",
      q: "Чьи следы видны на скале у мыса Эшпишел?", a: ["Динозавров", "Великанского кота", "Робота-пылесоса"] },
    { id: "pt-flamingos", e: "🦩", t: "Розовые фламинго у Лиссабона", s: "Река Тежу перед Лиссабоном разливается очень широко, и в ней много мелководья. Сюда каждый год прилетают тысячи розовых фламинго. Они стоят на одной ноге и опускают клюв в воду вверх ногами, чтобы процедить еду. Розовыми фламинго делает их еда: крошечные рачки и водоросли. Посмотреть на птиц лучше в бинокль и тихо, чтобы их не спугнуть.",
      q: "Что делает фламинго розовыми?", a: ["Их еда: рачки и водоросли", "Розовая краска", "Клубничное мороженое"] }
  ] },
  music: { name: 'Композиторы', e: '🎼', bg: 'var(--t-lilac)', items: [
    { id: 'mu-nutcracker', e: '🎄', t: 'Чайковский: «Щелкунчик»', s: 'Пётр Ильич Чайковский — великий русский композитор, он учился в Петербургской консерватории. Его балет «Щелкунчик» — сказка о новогодней ночи: девочка Маша, храбрый Щелкунчик и злой Мышиный король. В «Танце Феи Драже» звенит челеста — инструмент, похожий на маленькое пианино с колокольчиками. Чайковский нашёл её в Париже и держал в секрете до премьеры.',
      q: 'Какой инструмент звенит в «Танце Феи Драже»?', a: ['Челеста', 'Барабан', 'Труба'], listen: 'Чайковский Танец Феи Драже' },
    { id: 'mu-album', e: '🎹', t: 'Чайковский: «Детский альбом»', s: 'Чайковский написал для своего маленького племянника Володи двадцать четыре пьесы для фортепиано. Получился «Детский альбом». В нём есть «Болезнь куклы», «Новая кукла», «Марш деревянных солдатиков» и даже «Баба-яга». Эти пьесы до сих пор играют дети, которые учатся музыке.',
      q: 'Для кого Чайковский написал «Детский альбом»?', a: ['Для племянника', 'Для короля', 'Для кота'], listen: 'Чайковский Детский альбом Марш деревянных солдатиков' },
    { id: 'mu-bee', e: '🐝', t: 'Римский-Корсаков: «Полёт шмеля»', s: 'Николай Римский-Корсаков в молодости был морским офицером и почти три года плавал на военном корабле по морям и океанам. Потом он стал композитором и профессором Петербургской консерватории. В его опере «Сказка о царе Салтане» князь Гвидон превращается в шмеля. Музыка «Полёт шмеля» такая быстрая, что кажется — шмель жужжит прямо над ухом: ж-ж-ж!',
      q: 'В кого превращается князь Гвидон?', a: ['В шмеля', 'В кота', 'В рыбку'], listen: 'Римский-Корсаков Полёт шмеля' },
    { id: 'mu-peter', e: '🐺', t: 'Прокофьев: «Петя и волк»', s: 'Сергей Прокофьев написал музыкальную сказку для детей «Петя и волк». В ней каждого героя играет свой инструмент. Птичку — флейта, утку — гобой, кошку — кларнет, дедушку — фагот. Волка играют три валторны, а Петю — скрипки и другие струнные. Слушаешь — и узнаёшь героев по звуку!',
      q: 'Какой инструмент играет кошку?', a: ['Кларнет', 'Барабан', 'Арфа'], listen: 'Прокофьев Петя и волк' },
    { id: 'mu-pictures', e: '🐣', t: 'Мусоргский: «Картинки с выставки»', s: 'У композитора Модеста Мусоргского был друг — художник Виктор Гартман. Когда друга не стало, устроили выставку его рисунков. Мусоргский прошёлся по ней и написал музыку про картинки. Там есть «Избушка на курьих ножках», «Балет невылупившихся птенцов» и «Богатырские ворота». А между картинками звучит «Прогулка» — это сам композитор идёт по выставке.',
      q: 'Что звучит между картинками?', a: ['Прогулка', 'Колыбельная', 'Гимн'], listen: 'Мусоргский Балет невылупившихся птенцов' },
    { id: 'mu-glinka', e: '🧙', t: 'Глинка: «Руслан и Людмила»', s: 'Михаила Глинку называют отцом русской классической музыки. Он написал оперу по сказке Пушкина «Руслан и Людмила». В ней злой волшебник Черномор похищает Людмилу, а храбрый Руслан её спасает. Черномор — маленький старичок с огромной бородой, и в бороде вся его сила!',
      q: 'Где сила злого Черномора?', a: ['В бороде', 'В шляпе', 'В сапогах'], listen: 'Глинка Руслан и Людмила увертюра' },
    { id: 'mu-mozart', e: '🎻', t: 'Моцарт — чудо-ребёнок', s: 'Вольфганг Амадей Моцарт жил в Австрии. Он начал сочинять музыку, когда ему было всего пять лет! В шесть лет он уже выступал перед императрицей. Маленький Моцарт мог играть даже на клавишах, накрытых платком. За свою жизнь он написал больше шестисот произведений.',
      q: 'Во сколько лет Моцарт начал сочинять музыку?', a: ['В пять лет', 'В сорок лет', 'В сто лет'], listen: 'Моцарт Маленькая ночная серенада' },
    { id: 'mu-beethoven', e: '🎵', t: 'Бетховен и «Ода к радости»', s: 'Людвиг ван Бетховен — немецкий композитор. Взрослым он начал терять слух и со временем совсем перестал слышать. Но он продолжал сочинять: музыка звучала у него внутри. Так он написал Девятую симфонию с «Одой к радости». Эту мелодию знает весь мир, её можно сыграть даже на детском пианино.',
      q: 'Как Бетховен сочинял, когда перестал слышать?', a: ['Музыка звучала у него внутри', 'Просил соседей', 'Перестал сочинять'], listen: 'Бетховен Ода к радости' },
    { id: 'mu-vivaldi', e: '🍂', t: 'Вивальди: «Времена года»', s: 'Итальянский композитор Антонио Вивальди был рыжим, и его прозвали «рыжим священником». Он написал четыре концерта для скрипки и оркестра: «Весна», «Лето», «Осень» и «Зима». В «Весне» поют птицы и журчат ручьи. В «Лете» гремит гроза. А в «Зиме» скрипки дрожат, будто от холода стучат зубы.',
      q: 'Сколько концертов во «Временах года»?', a: ['Четыре', 'Два', 'Десять'], listen: 'Вивальди Времена года Весна' },
    { id: 'mu-bach', e: '🎶', t: 'Бах и орган', s: 'Иоганн Себастьян Бах жил в Германии больше трёхсот лет назад. Он был органистом: играл на огромном органе в церкви. У органа сотни труб — от крошечных, как карандаш, до огромных, выше двухэтажного дома. Играют на органе руками и даже ногами! В семье Баха было много детей, и несколько из них тоже стали композиторами.',
      q: 'Чем ещё играют на органе, кроме рук?', a: ['Ногами', 'Носом', 'Локтями'], listen: 'Бах Токката и фуга ре минор' },
    { id: 'mu-fado', e: '🎸', t: 'Фаду — песни Лиссабона', s: 'В Лиссабоне поют фаду — грустные и красивые песни о море, о дальних путешествиях и о тоске по дому. Певцу помогает португальская гитара: у неё круглый корпус, похожий на грушу, и двенадцать струн. Фаду так любят, что эти песни внесли в список сокровищ всего человечества.',
      q: 'Сколько струн у португальской гитары?', a: ['Двенадцать', 'Одна', 'Сто'], listen: 'фаду португальская гитара' },
    { id: 'mu-shost', big: 1, e: '🎺', t: 'Шостакович и Ленинградская симфония', s: 'Дмитрий Шостакович родился и жил в Петербурге. Во время войны город был окружён врагами, людям было голодно и холодно. Шостакович начал писать там свою Седьмую симфонию и посвятил её родному городу. Летом 1942 года её сыграли в Ленинграде, и музыку передавали по радио. Люди слушали и чувствовали: город выстоит.',
      q: 'Кому Шостакович посвятил Седьмую симфонию?', a: ['Родному городу', 'Своему коту', 'Морю'], listen: 'Шостакович Седьмая симфония Ленинградская' }
  ] },
  art: { name: 'Художники и картины', e: '🖼️', bg: 'var(--t-peach)', items: [
    { id: 'ar-aiv', e: '🌊', t: 'Айвазовский и «Девятый вал»', s: 'Иван Айвазовский больше всего на свете любил рисовать море. Он написал около шести тысяч картин! Самая знаменитая — «Девятый вал»: после бури моряки держатся за обломок мачты, а над ними встаёт огромная волна и рассветное солнце. Айвазовский рисовал волны по памяти. Эта картина хранится в Русском музее в Петербурге.',
      q: 'Что любил рисовать Айвазовский?', a: ['Море', 'Котов', 'Машины'], look: 'Айвазовский Девятый вал' },
    { id: 'ar-shishkin', e: '🐻', t: 'Шишкин: «Утро в сосновом лесу»', s: 'Иван Шишкин рисовал лес так, что кажется — сейчас запахнет хвоей. На картине «Утро в сосновом лесу» медведица с медвежатами играет на поваленной сосне. Но вот секрет: медведей нарисовал не Шишкин, а его друг, художник Константин Савицкий. Эта картина есть даже на обёртке конфет «Мишка косолапый».',
      q: 'Кто нарисовал медведей на картине?', a: ['Константин Савицкий', 'Иван Шишкин', 'Сами медведи'], look: 'Шишкин Утро в сосновом лесу' },
    { id: 'ar-vasn', e: '🛡️', t: 'Васнецов: «Богатыри»', s: 'Виктор Васнецов очень любил русские сказки и былины. На его картине «Богатыри» три могучих воина на конях: посередине Илья Муромец, рядом Добрыня Никитич и Алёша Попович. Они смотрят вдаль — не идёт ли враг. Васнецов работал над этой картиной почти тридцать лет!',
      q: 'Сколько богатырей на картине?', a: ['Три', 'Два', 'Десять'], look: 'Васнецов Богатыри' },
    { id: 'ar-bryull', big: 1, e: '🌋', t: 'Брюллов: «Последний день Помпеи»', s: 'Почти две тысячи лет назад рядом с городом Помпеи проснулся вулкан Везувий. Художник Карл Брюллов побывал там и нарисовал огромную картину о том дне. Люди спасаются и помогают друг другу. А среди героев картины Брюллов нарисовал себя — художника с ящиком красок на голове. Эта картина хранится в Русском музее.',
      q: 'Кого Брюллов нарисовал среди героев картины?', a: ['Себя', 'Свою кошку', 'Космонавта'], look: 'Брюллов Последний день Помпеи' },
    { id: 'ar-leo', e: '🪞', t: 'Леонардо да Винчи', s: 'Леонардо да Винчи был художником, изобретателем и учёным. Он нарисовал «Мону Лизу» с загадочной улыбкой. Леонардо придумывал летательные машины и записывал свои мысли зеркальным почерком — справа налево. А в Эрмитаже в Петербурге есть две его картины: «Мадонна Литта» и «Мадонна Бенуа».',
      q: 'Как писал Леонардо?', a: ['Зеркально, справа налево', 'Только мелом', 'Ногами'], look: 'Леонардо да Винчи Мадонна Литта' },
    { id: 'ar-vangogh', e: '🌌', t: 'Ван Гог: «Звёздная ночь»', s: 'Голландский художник Винсент Ван Гог рисовал густыми мазками яркой краски. На картине «Звёздная ночь» небо закручивается вихрями, звёзды сияют, как фонарики, а над холмами висит жёлтый месяц. Ван Гог нарисовал вид из своего окна, но небо придумал сам. Попробуй нарисовать своё небо с вихрями!',
      q: 'Каким нарисовано небо на «Звёздной ночи»?', a: ['С вихрями', 'Совсем пустым', 'В клеточку'], look: 'Ван Гог Звёздная ночь' },
    { id: 'ar-monet', e: '🪷', t: 'Моне и кувшинки', s: 'Французский художник Клод Моне любил рисовать свет: утренний, вечерний, солнечный и туманный. У него был сад с прудом и японским мостиком. В пруду росли кувшинки, и Моне рисовал их снова и снова — около двухсот пятидесяти картин! А одна его картина называется «Впечатление», и от этого слова пошло название целого направления в искусстве — импрессионизм.',
      q: 'Что Моне рисовал снова и снова?', a: ['Кувшинки', 'Танки', 'Котлеты'], look: 'Моне Кувшинки' },
    { id: 'ar-kand', e: '🎨', t: 'Кандинский: картины-музыка', s: 'Василий Кандинский слышал цвета, как музыку. Жёлтый звучал для него, как труба, а синий — как виолончель. Он рисовал не дома и людей, а круги, линии и пятна, похожие на музыку. Так он стал одним из первых художников-абстракционистов. Включи музыку и нарисуй, как она звучит!',
      q: 'Что Кандинский слышал, когда смотрел на цвета?', a: ['Музыку', 'Лай собак', 'Шум дождя'], look: 'Кандинский Композиция' },
    { id: 'ar-malevich', e: '⬛', t: 'Малевич: «Чёрный квадрат»', s: 'Казимир Малевич нарисовал чёрный квадрат на белом фоне. Многие удивлялись: и это картина? А Малевич хотел показать, что картина может быть совсем без предметов — только форма и цвет. «Чёрный квадрат» стал одной из самых известных картин в мире. Один из его вариантов хранится в Эрмитаже.',
      q: 'Что нарисовал Малевич?', a: ['Чёрный квадрат', 'Розового слона', 'Портрет кота'], look: 'Малевич Чёрный квадрат' }
  ] }

   achievements, a streak flame with freezes, S/A/B/C grades. Every reward is earned and known in advance: no loot boxes. ---------- */
const lvlOf = xp => { let n = 1; while (5 * n * (n + 1) / 2 <= xp) n++; return n; };
const lvlStart = n => 5 * (n - 1) * n / 2;
const SEASON_NAMES = ['Ледяной бит', 'Лавина', 'Весенний флоу', 'Полёт', 'Майский баттл', 'Летний лагерь', 'Волна', 'Солнечный скейт', 'Школьный флоу', 'Листопад', 'Ночной лес', 'Ёлочный бит'];
const seasonId = () => dayKey().slice(0, 7);
const seasonName = () => SEASON_NAMES[+seasonId().slice(5, 7) - 1];
const PASS = [

];
const TIER_XP = 8;
const passName = r => r.name || (r.kind === 'title' ? `Звание «${r.v}»` : r.kind === 'stars' ? `${r.v} ${plural(r.v, ['звезда', 'звезды', 'звёзд'])}` : r.v);
const MIC_SKINS = { classic: '🎤', gold: '🎤✨', neon: '🎤💠', fire: '🎤🔥' };
const FRAMES = { neon: 'Неоновая', fire: 'Огненная', gold: 'Золотая' };
const BIKE_SKINS = { neon: { body: '#39FF14', suit: '#0B3D0B' }, gold: { body: '#FFD54A', suit: '#3A2A00' } };
function cos() { P.cos = P.cos || { titles: [], mics: ['classic'], beats: ['old'], frames: [], bikes: [], mic: 'classic', beat: 'old' }; return P.cos; }
function season() {
  if (!P.season || P.season.id !== seasonId()) P.season = { id: seasonId(), xp: 0, claimed: [] };
  return P.season;
}
const tierOf = s => Math.min(PASS.length, Math.floor(s.xp / TIER_XP));
function claimTier(i) {
  const s = season(), r = PASS[i], c = cos();
  if (s.claimed.includes(i) || tierOf(s) <= i) return false;
  s.claimed.push(i);

  else if (r.kind === 'freeze') P.freeze = Math.min(3, (P.freeze || 0) + r.v);

  save(); return true;
}

function challenges() {
  const d = dayKey();
  if (!P.ch || P.ch.d !== d) {
    const h = [...d].reduce((a, c) => a * 31 + c.charCodeAt(0) >>> 0, 7);

    P.ch = { d, ids: [pick('s'), pick('m'), pick('x')], prog: {}, done: [], chest: false };
  }
  return P.ch;
}

/* streak freezes: a missed day is covered automatically while a freeze is left */
function useFreezes() {
  if (!Q()) return;
  const d = new Date(); d.setDate(d.getDate() - 1); const y = dayKey(d); d.setDate(d.getDate() - 1); const yy = dayKey(d);
  P.frozen = P.frozen || [];
  if (!dayTotal(y) && !P.frozen.includes(y) && (dayTotal(yy) || P.frozen.includes(yy)) && (P.freeze || 0) > 0) { P.freeze--; P.frozen.push(y); P.frozen = P.frozen.slice(-30); save(); return true; }
  return false;
}

// called from finish(): season XP, challenges, achievements, level-ups; returns the toasts to show
function gameHook(ev) {
  if (!Q()) return [];
  const out = [], s = season(), ch = challenges(), lv0 = lvlOf(ev.xp0), lv1 = lvlOf(P.stars), tier0 = tierOf(s);
  s.xp += ev.stars + (ev.lesson ? 3 : 0);
  if (ev.key === 'l-rap' && ev.grade && (!P.rapBest || 'SABC'.indexOf(ev.grade) < 'SABC'.indexOf(P.rapBest))) P.rapBest = ev.grade;
  for (const id of ch.ids) {
    if (ch.done.includes(id)) continue;
    const c = CHALL.find(x => x.id === id), r = c.test(ev);
    if (!r) continue;
    ch.prog[id] = (ch.prog[id] || 0) + (c.n ? +r : 1);
    if (ch.prog[id] >= (c.n || 1)) { ch.done.push(id); s.xp += 6; out.push({ e: c.e, t: 'Челлендж выполнен!', d: c.t + ' · +6 XP сезона' }); }
  }
  if (ch.done.length === 3 && !ch.chest) out.push({ e: '📦', t: 'Сундук дня готов!', d: 'Открой его на главной' });
  const tier1 = tierOf(s);
  if (tier1 > tier0) out.push({ e: '🎟️', t: `Уровень пропуска ${tier1}!`, d: `Награда: ${passName(PASS[tier1 - 1])}` });

function flashSeq(L) {

    if (neg && i > 0 && Math.random() < .35 && sum - v >= 0) v = -v;
    sum += v; out.push(v);

}

/* ---------- the app's own voice: Piper (Rhasspy) running in a background worker of the browser, so games never stall.
   The voice file (about 63 MB) downloads once from Hugging Face and stays on the phone; until it is ready the phone's
   own voice speaks. Every line said once is kept in the «govorilki-voice» cache and plays instantly next time. ---------- */
const PIPER_VOICES = [['ru_RU-irina-medium', 'Ирина'], ['ru_RU-denis-medium', 'Денис'], ['ru_RU-dmitri-medium', 'Дмитрий'], ['ru_RU-ruslan-medium', 'Руслан']];
const PIPER_SRC = `
let s = null, tts = null, q = Promise.resolve();
async function run({ id, voice, text }) {
  try {
    if (!tts) tts = await import('https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.5/+esm');
    if (!s || s.voiceId !== voice) {
      tts.TtsSession._instance = null;
      s = await tts.TtsSession.create({ voiceId: voice, progress: p => self.postMessage({ progress: p.total ? p.loaded / p.total : 0 }),
        wasmPaths: { onnxWasm: 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/', piperData: tts.WASM_BASE + '.data', piperWasm: tts.WASM_BASE + '.wasm' } });
    }
    if (!text) { self.postMessage({ id, ok: true }); return; }
    const buf = await (await s.predict(text)).arrayBuffer();
    self.postMessage({ id, ok: true, buf }, [buf]);
  } catch (err) { self.postMessage({ id, ok: false, err: String(err && err.message || err) }); }
}
self.onmessage = e => { q = q.then(() => run(e.data)); };`;
const PIPER = { w: null, n: 0, wait: {}, ready: null, readyVoice: null, isReady: false, pct: 0, failed: false, mem: new Map() };
const piperVoice = () => PIPER_VOICES.some(v => v[0] === ROOT.piperVoice) ? ROOT.piperVoice : PIPER_VOICES[0][0];
const piperName = () => PIPER_VOICES.find(v => v[0] === piperVoice())[1];
const piperOn = () => !EMBEDDED && (ROOT.engine || 'piper') === 'piper' && !PIPER.failed && typeof Worker === 'function' && typeof WebAssembly === 'object';
function piperCall(text) {
  if (!PIPER.w) {
    try { PIPER.w = new Worker(URL.createObjectURL(new Blob([PIPER_SRC], { type: 'text/javascript' })), { type: 'module' }); }
    catch (e) { PIPER.failed = true; return Promise.reject(e); }
    PIPER.w.onmessage = e => { const d = e.data; if (d.progress != null) { PIPER.pct = d.progress; return; } const f = PIPER.wait[d.id]; delete PIPER.wait[d.id]; if (f) f(d); };
    PIPER.w.onerror = () => { PIPER.failed = true; Object.values(PIPER.wait).forEach(f => f({ ok: false, err: 'worker' })); PIPER.wait = {}; };
  }
  const voice = piperVoice();
  return new Promise((res, rej) => { const id = ++PIPER.n; PIPER.wait[id] = d => d.ok ? res(d.buf) : rej(new Error(d.err)); PIPER.w.postMessage({ id, voice, text }); });
}
function piperWarm() {
  if (!piperOn()) return Promise.resolve(false);
  const v = piperVoice();
  if (PIPER.ready && PIPER.readyVoice === v) return PIPER.ready;
  PIPER.readyVoice = v; PIPER.isReady = false; PIPER.pct = 0;
  PIPER.ready = piperCall('').then(() => { if (PIPER.readyVoice === v) PIPER.isReady = true; return true; }, () => { PIPER.failed = true; return false; });
  return PIPER.ready;
}
async function piperAudio(text) {
  const key = piperVoice() + '|' + text;
  if (PIPER.mem.has(key)) return PIPER.mem.get(key);
  const url = 'https://govorilki.local/piper/' + piperVoice() + '/' + encodeURIComponent(text);
  const job = (async () => {
    let cache = null; try { cache = await caches.open('govorilki-voice'); } catch (e) {}
    const hit = cache && await cache.match(url);
    const buf = hit ? await hit.arrayBuffer() : await piperCall(text);
    if (!hit && cache) { try { await cache.put(url, new Response(buf.slice(0), { headers: { 'Content-Type': 'audio/wav' } })); } catch (e) {} }
    return ac().decodeAudioData(buf);
  })();
  PIPER.mem.set(key, job); if (PIPER.mem.size > 80) PIPER.mem.delete(PIPER.mem.keys().next().value);
  job.catch(() => PIPER.mem.delete(key));
  return job;
}
// the voice starts loading at the first touch, so nobody downloads it by just glancing at the page
document.addEventListener('pointerdown', () => { if (piperOn()) piperWarm(); }, { once: true, capture: true });

/* ---------- hearing WHAT was said: the browser's speech recognition (Chrome, Safari) checks the word itself.
   A slipped Л (лодка → водка) comes back as a different word, and the child sees what was heard.
   Where recognition is missing or refused, the loudness check stays as before. ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const HEAR = { off: false };
const srOk = () => !!SR && !EMBEDDED && !ROOT.micOff && !ROOT.srOff && !HEAR.off;
const normW = s => String(s).toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) { let p = d[0]; d[0] = i; for (let j = 1; j <= b.length; j++) { const q = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] !== b[j - 1])); p = q; } }
  return d[b.length];
}
const cntL = w => (w.match(/л/g) || []).length;
// a long word may differ by one letter, but never in the Л sounds being trained
const wordOk = (h, t) => h === t || (t.length >= 5 && lev(h, t) <= 1 && cntL(h) === cntL(t));
function matchSay(heard, expect, times = 1) {
  const hw = normW(heard).split(' ').filter(Boolean), tw = normW(expect).split(' ').filter(Boolean);
  if (!tw.length) return false;
  if (tw.length === 1) return hw.filter(w => wordOk(w, tw[0])).length >= Math.min(times, 2);
  return tw.filter(t => hw.some(w => wordOk(w, t))).length / tw.length >= .6;
}
function hear(expect, { times = 1, onHeard, maxMs = 7000 } = {}) {
  return new Promise(res => {
    let r = null, best = '', done = false;
    const end = ok => { if (done) return; done = true; SR_ON = Math.max(0, SR_ON - 1); try { r && r.abort(); } catch (e) {} if (!MIC.stream && !SR_ON) audioSession('playback'); res({ ok, heard: best }); };
    try { r = new SR(); } catch (e) { HEAR.off = true; res({ ok: false, heard: '' }); return; }
    audioSession('play-and-record'); SR_ON++;
    r.lang = 'ru-RU'; r.interimResults = true; r.maxAlternatives = 5; r.continuous = times > 1 || normW(expect).includes(' ');
    r.onresult = e => {
      let all = ''; const alts = [];
      for (let i = 0; i < e.results.length; i++) { all += ' ' + e.results[i][0].transcript; for (let j = 0; j < e.results[i].length; j++) alts.push(e.results[i][j].transcript); }
      best = all.trim(); if (onHeard) onHeard(best);
      if (matchSay(best, expect, times) || alts.some(a => matchSay(a, expect, times))) end(true);
    };
    r.onerror = e => { if (['not-allowed', 'service-not-allowed', 'audio-capture', 'language-not-supported'].includes(e.error)) HEAR.off = true; end(false); };
    r.onend = () => end(false);
    setTimeout(() => end(false), maxMs);
    try { r.start(); } catch (e) { end(false); }
  });
}
/* one recognition session for a whole game. iPhone allows starting it only from a tap and asks for permission at that
   moment, so the game starts it on «Поехали», keeps it running (restarting when the phone closes it) and checks every
   phrase against the word on the screen right now. When a restart is refused, one tap on the sign brings it back. */
let LIVE = null;
function liveStop() { if (LIVE) { LIVE.stop(); LIVE = null; } }
function hearLive(onText, { onStart, onFail, onLost } = {}) {
  liveStop();
  if (!srOk()) { if (onFail) onFail(); return null; }
  let r = null, stopped = false, started = false, alive = false, restarts = 0, sess = 0;
  const first = new Map();   // when each phrase was first heard, so a game can ignore what was said before its question
  SR_ON++; audioSession('play-and-record');
  const L = {
    stop() { if (!stopped) { SR_ON = Math.max(0, SR_ON - 1); if (!MIC.stream && !SR_ON) audioSession('playback'); } stopped = true; alive = false; try { r && r.abort(); } catch (e) {} },
    resume() { if (stopped || alive) return; L.lost = false; restarts = 0; go(); },
    get on() { return alive; }, lost: false
  };
  function go() {
    if (stopped) return;
    try { r = new SR(); } catch (e) { HEAR.off = true; L.stop(); if (onFail) onFail(); return; }
    r.lang = 'ru-RU'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 3; sess++;
    r.onstart = () => { alive = true; if (!started) { started = true; if (onStart) onStart(); } };
    r.onresult = e => {
      // game beeps do not confuse recognition (they only mute the loudness meter); the friend's own voice does
      if (SAYING > 0 || performance.now() < MIC.voiceUntil) return;
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i], alts = [], k = sess + ':' + i; for (let j = 0; j < res.length; j++) alts.push(res[j].transcript);
        if (!first.has(k)) { first.set(k, performance.now()); if (first.size > 300) first.delete(first.keys().next().value); }
        onText(res[0].transcript.trim(), alts, res.isFinal, first.get(k));
      }
    };
    r.onerror = e => {
      const hard = ['not-allowed', 'service-not-allowed', 'language-not-supported', 'audio-capture'].includes(e.error);
      if (!hard) return;
      if (!started) { if (e.error !== 'audio-capture') HEAR.off = true; L.stop(); if (onFail) onFail(); }
      else { L.lost = true; if (onLost) onLost(); }
    };
    r.onend = () => {
      alive = false;
      if (stopped || L.lost) return;
      if (++restarts > 80) { L.lost = true; if (onLost) onLost(); return; }
      setTimeout(go, 150);
    };
    try { r.start(); } catch (e) { if (!started) { L.stop(); if (onFail) onFail(); } }
  }
  go();
  LIVE = L; return L;
}
