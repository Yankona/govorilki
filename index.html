<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="description" content="Логопедическая игра для детей 5–6 лет: дыхание, зарядка для язычка и игры со звуком Р.">
<meta name="theme-color" content="#CDEEF6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Говорилки">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Говорилки с Рыжиком</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: an island of big pastel "stations"; each opens a full-height stage where the tiger cub Рыжик speaks from the bottom bar.
   One bright daytime world on purpose (a children's game), so there is no dark palette. */
:root{
  --sky:#CDEEF6; --ink:#2A2346; --ink-soft:#5E5683; --paper:#FFFFFF;
  --tiger:#FF8A2A; --tiger-deep:#D9640C; --berry:#EF4F7E; --leaf:#2FA865; --sun:#FFC83A; --sea:#3D8BFD; --plum:#8C6CF2;
  --t-blue:#DCEDFF; --t-green:#E3F5D0; --t-peach:#FFE6CC; --t-lilac:#ECE3FF; --t-pink:#FFE0E8; --t-yellow:#FFF1BF; --t-mint:#D4F3E8;
  --line:rgba(42,35,70,.12); --line-strong:rgba(42,35,70,.2); --shade:rgba(42,35,70,.45);
  --f-display:"Balsamiq Sans","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;overflow:hidden;color:var(--ink);font:700 18px/1.35 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-tap-highlight-color:transparent;
  background-color:var(--sky);
  background-image:
    radial-gradient(ellipse 160px 46px at 12% 9%,rgba(255,255,255,.9) 70%,transparent 72%),
    radial-gradient(ellipse 110px 34px at 18% 6%,rgba(255,255,255,.9) 70%,transparent 72%),
    radial-gradient(ellipse 190px 50px at 86% 15%,rgba(255,255,255,.75) 70%,transparent 72%),
    radial-gradient(ellipse 130px 40px at 92% 11%,rgba(255,255,255,.75) 70%,transparent 72%),
    radial-gradient(ellipse 140px 40px at 60% 92%,rgba(255,255,255,.55) 70%,transparent 72%);
  background-attachment:fixed}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--sea);outline-offset:3px}
h1,h2{text-wrap:balance}
.emo,.pic.emo{font-family:var(--f-emoji);font-weight:400}
.pic{display:inline-grid;place-items:center;width:1.2em;height:1.2em;line-height:1;flex:none}
.pic svg{width:100%;height:100%;display:block}
b.r{color:var(--berry)}

#app{height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px 6px}
.bar h1{margin:0;flex:1;min-width:0;font:700 clamp(21px,4.4vw,30px)/1.1 var(--f-display)}
.ibtn{width:56px;height:56px;flex:none;border:0;border-radius:18px;background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 var(--line-strong)}
.ibtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line-strong)}
.starpill{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:8px 16px 8px 10px;font:900 22px/1 var(--f-body);box-shadow:0 5px 0 var(--line-strong);font-variant-numeric:tabular-nums;flex:none}
.star-i{width:28px;height:28px;display:block}
.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:8px 12px}
.stage.scroll{align-items:stretch;gap:22px}
.lead{margin:0;text-align:center;color:var(--ink-soft);max-width:36em}

.guide{display:flex;align-items:center;gap:10px;padding-block:6px 12px}
.guide-ryz{width:66px;height:66px;flex:none;border:0;padding:0;background:none;cursor:pointer}
.guide-ryz svg{width:100%;height:100%}
.guide-ryz.talking svg{animation:bob .7s ease-in-out 2}
.bubble{position:relative;flex:1;min-width:0;margin:0;background:var(--paper);border-radius:20px;padding:10px 16px;font:700 17px/1.3 var(--f-body);box-shadow:0 4px 0 var(--line)}
.guide .bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--paper);border-left:0}

/* buttons */
.big{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:62px;padding:10px 26px;border:0;border-radius:999px;background:var(--tiger);color:#fff;font:700 24px/1.1 var(--f-display);box-shadow:0 7px 0 var(--tiger-deep);cursor:pointer}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--tiger-deep)}
.big.ghost{background:var(--paper);color:var(--ink);box-shadow:0 7px 0 var(--line-strong)}
.big.danger{background:var(--berry);color:#fff;box-shadow:0 7px 0 #B8305A}
.big.ghost.danger{background:var(--paper);color:var(--berry);box-shadow:0 7px 0 var(--line-strong)}
.big svg{width:28px;height:28px}
.said{position:fixed;z-index:45;left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);display:flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 30px 14px 18px;background:var(--sun);color:var(--ink);font:700 28px/1 var(--f-display);box-shadow:0 7px 0 #D39A00,0 14px 30px rgba(42,35,70,.25);cursor:pointer;animation:popin .4s both,pulse 1.6s .5s ease-in-out infinite}
.said .star-i{width:40px;height:40px}
.said:active{box-shadow:0 2px 0 #D39A00}

/* home */
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:12px}
.hero-ryz{width:clamp(104px,22vw,150px);aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;flex:none}
.hero-ryz svg{width:100%;height:100%;animation:bob 3s ease-in-out infinite}
.hero-text{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}
.logo{margin:0;font:700 clamp(36px,8vw,58px)/.95 var(--f-display);letter-spacing:.01em}
.logo .lt{display:inline-block}
.logo .lt:nth-child(4n+1){color:var(--tiger-deep);transform:rotate(-4deg)}
.logo .lt:nth-child(4n+2){color:var(--berry);transform:translateY(-3px) rotate(3deg)}
.logo .lt:nth-child(4n+3){color:var(--sea);transform:rotate(-2deg)}
.logo .lt:nth-child(4n){color:var(--leaf);transform:translateY(2px) rotate(4deg)}
.logo .sub{display:block;font-size:.5em;color:var(--ink);margin-top:6px;letter-spacing:.02em}
.hero .bubble{flex:none;max-width:34em}
.hero .bubble::before{content:"";position:absolute;left:-10px;top:18px;border:10px solid transparent;border-right-color:var(--paper);border-left:0}
.hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.chip{display:flex;align-items:center;gap:8px;border:0;border-radius:18px;background:var(--paper);padding:8px 16px 8px 10px;font:800 17px var(--f-body);cursor:pointer;box-shadow:0 5px 0 var(--line-strong)}
.chip .emo{font-size:30px;line-height:1}
.chip{white-space:nowrap}
.group{display:flex;flex-direction:column;gap:12px}
.group-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.group-head h2{margin:0;font:700 clamp(24px,4vw,30px)/1.1 var(--f-display)}
.group-head p{margin:0;color:var(--ink-soft);font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tiles>.tile:last-child:nth-child(odd){grid-column:span 2}
@media (min-width:760px){
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tiles>.tile:last-child:nth-child(odd){grid-column:auto}
  .tiles.warm>.tile,.tiles>.tile:last-child:nth-child(4n+3),.tiles>.tile:last-child:nth-child(4n+2),.tiles>.tile:nth-last-child(2):nth-child(4n+1){grid-column:span 2}
}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:178px;padding:14px 14px 14px;border:0;border-radius:26px;background:var(--bg);text-align:left;cursor:pointer;box-shadow:0 7px 0 var(--line-strong)}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 var(--line-strong)}
.tile-ico{font-size:60px;height:76px;display:flex;align-items:center}
.tile-ico .face{width:76px;height:76px}
.tile b{font:700 20px/1.12 var(--f-display)}
.tile small{color:var(--ink-soft);font:700 14px/1.25 var(--f-body)}
.tile .prog{margin-top:auto;display:flex;align-items:center;gap:2px;font:800 14px var(--f-body);color:var(--ink-soft);padding-top:6px}
.prog .star-i{width:20px;height:20px}
.prog .off{opacity:.25;filter:grayscale(1)}
.syl-ico{display:flex;gap:4px}
.syl-ico i{font:900 15px/1 var(--f-body);font-style:normal;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:inset -3px -4px 0 rgba(0,0,0,.12)}
.mini-crate{position:relative;width:70px;height:62px}
.mini-crate svg{width:100%;height:100%}
.mini-crate em{position:absolute;left:8px;top:22px;font:900 30px/1 var(--f-body);font-style:normal;color:var(--berry);-webkit-text-stroke:2px #fff;paint-order:stroke fill}
.link-btn{align-self:center;border:0;background:none;color:var(--ink-soft);font:800 16px var(--f-body);text-decoration:underline;text-underline-offset:4px;padding:10px;cursor:pointer}

/* daily plan */
.today{background:var(--paper);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 7px 0 var(--line-strong),inset 0 0 0 4px var(--sun)}
.today.is-done{box-shadow:0 7px 0 var(--line-strong),inset 0 0 0 4px var(--leaf)}
.today-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.today h2{margin:0;font:700 clamp(24px,4vw,30px)/1.1 var(--f-display)}
.today .muted{margin:4px 0 0}
.week{display:flex;gap:4px;border:0;background:none;padding:0;cursor:pointer}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;font:800 12px var(--f-body);color:var(--ink-soft)}
.wd i{width:32px;height:32px;border-radius:50%;background:var(--sky);display:grid;place-items:center}
.wd.on i{background:var(--t-yellow)}
.wd.now i{box-shadow:inset 0 0 0 3px var(--tiger)}
.wd .star-i{width:24px;height:24px}
.today-parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.part{display:flex;align-items:center;gap:10px;min-width:0;background:var(--sky);border-radius:18px;padding:8px 12px}
.part.full{background:var(--t-green)}
.part-ico{flex:none;width:46px;height:46px;display:grid;place-items:center;font-size:38px}
.part-ico .face{width:46px;height:46px}
.part-t{flex:1;min-width:0;display:flex;flex-direction:column}
.part-t b{font:700 16px/1.15 var(--f-display)}
.part-t small{font:700 13px/1.25 var(--f-body);color:var(--ink-soft)}
.part em{font:900 16px var(--f-body);font-style:normal;font-variant-numeric:tabular-nums}
.part.full em{color:var(--leaf)}
.today-bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.today-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--leaf),var(--sun))}
.today-go{align-self:center}
.today.is-done .today-go{background:var(--leaf);box-shadow:0 7px 0 #1F7A47}
.day-prog{margin:0;font:800 15px var(--f-body);color:var(--ink-soft)}
.stamp{width:150px;height:150px;border-radius:50%;background:var(--t-yellow);box-shadow:inset 0 0 0 8px var(--tiger);display:grid;place-items:center;animation:stamp .6s cubic-bezier(.3,1.6,.5,1) both}
.stamp svg{width:74%;height:74%}
.dd-line{margin:0;font:700 22px/1.2 var(--f-display)}

/* calendar */
.cal{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(100%,560px);margin:0 auto}
.cal-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.cal-stats div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;text-align:center;background:var(--paper);border-radius:20px;box-shadow:0 4px 0 var(--line)}
.cal-stats b{font:900 34px/1 var(--f-body);color:var(--tiger-deep);font-variant-numeric:tabular-nums}
.cal-stats small{font:700 13px/1.2 var(--f-body);color:var(--ink-soft)}
.cal-card{width:100%;background:var(--paper);border-radius:26px;padding:14px;box-shadow:0 5px 0 var(--line)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.cal-head h2{margin:0;font:700 24px/1.1 var(--f-display)}
.ibtn:disabled{opacity:.3;cursor:default;box-shadow:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cw{text-align:center;font:800 13px var(--f-body);color:var(--ink-soft)}
.cd{position:relative;aspect-ratio:1;border-radius:12px;background:var(--sky);display:grid;place-items:center;font:800 16px var(--f-body);font-variant-numeric:tabular-nums}
.cd.blank{background:none}
.cd.on{background:var(--t-yellow)}
.cd.on b{position:absolute;top:2px;left:5px;font-size:11px}
.cd .star-i{width:66%;height:66%}
.cd.now{box-shadow:inset 0 0 0 3px var(--tiger)}
.cd.future{opacity:.45}
.medals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.medal{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;text-align:center;background:var(--paper);border-radius:18px;box-shadow:0 4px 0 var(--line)}
.medal .emo{font-size:40px;line-height:1;filter:grayscale(1);opacity:.3}
.medal.got .emo{filter:none;opacity:1}
.medal small{font:700 12px/1.2 var(--f-body);color:var(--ink-soft)}

/* lessons on the home card */
.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:var(--lb)}
.l-ico{width:52px;height:52px;display:grid;place-items:center}
.l-ico .face{width:52px;height:52px}
.l-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.l-t b{font:700 20px/1.1 var(--f-display)}
.l-t small{font:700 13px/1.25 var(--f-body);color:var(--ink-soft)}
.l-bar{height:8px;border-radius:99px;background:rgba(42,35,70,.1);overflow:hidden}
.l-bar i{display:block;height:100%;border-radius:inherit;background:var(--lc)}
.l-n{display:flex;align-items:center;gap:2px;font:900 16px var(--f-body);font-variant-numeric:tabular-nums}
.l-n .star-i{width:22px;height:22px}
.l-go{min-height:52px;padding:8px 18px;font-size:19px}
.l-go svg{width:22px;height:22px}
.ico-letters{display:flex;align-items:center;gap:2px;font:900 40px/1 var(--f-body)}
.ico-num{font:900 32px/1 var(--f-body);color:var(--plum);white-space:nowrap}
.cd em{position:absolute;top:2px;right:4px;font:900 11px var(--f-body);font-style:normal;color:var(--tiger-deep)}
.cd .dots{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.cd .dots i{width:6px;height:6px;border-radius:50%}
.cal-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px;font:700 13px var(--f-body);color:var(--ink-soft)}
.cal-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}

/* letters & reading: vowels red, consonants blue, like in a primer */
.L{font-weight:900}
.L.v{color:var(--berry)}
.L.c{color:var(--sea)}
.L.s{color:var(--ink-soft)}
.hl{color:var(--berry);background:var(--t-yellow);border-radius:6px;padding:0 2px}
.abc-card{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;width:min(100%,560px);padding:14px 22px;background:var(--paper);border-radius:28px;box-shadow:0 5px 0 var(--line)}
.abc-card.pop{animation:popin .35s}
.abc-big{display:flex;gap:4px;font:900 clamp(64px,14vmin,104px)/1 var(--f-body)}
.abc-pic{font-size:clamp(54px,12vmin,86px)}
.abc-w{margin:0;min-height:1.2em;font:900 clamp(22px,5vmin,32px)/1.2 var(--f-body);letter-spacing:.08em}
.abc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;width:100%}
.abc-k{aspect-ratio:1;border:0;border-radius:16px;background:var(--paper);font:900 30px/1 var(--f-body);cursor:pointer;box-shadow:0 4px 0 var(--line-strong)}
.lt-ask{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;min-height:96px;padding:14px 22px;border:0;border-radius:24px;background:var(--paper);color:var(--ink);font:700 22px var(--f-display);cursor:pointer;box-shadow:0 5px 0 var(--line)}
.lt-ask>svg{width:36px;height:36px;color:var(--plum)}
.lt-show{display:flex;align-items:center;gap:12px;font:900 64px/1 var(--f-body)}
.lt-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(100%,420px)}
.lt-opts.three{grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,480px)}
@media (min-width:700px){.lt-opts{grid-template-columns:repeat(4,minmax(0,1fr));width:min(100%,640px)}.lt-opts.three{grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,520px)}}
.lt-b{aspect-ratio:1.1;border:0;border-radius:26px;background:var(--paper);font:900 clamp(56px,13vmin,90px)/1 var(--f-body);cursor:pointer;box-shadow:0 7px 0 var(--line-strong)}
.lt-b.right{background:var(--t-green);box-shadow:0 7px 0 var(--leaf)}
.fl-pic{width:clamp(150px,32vmin,230px);aspect-ratio:1;border:0;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:clamp(90px,20vmin,150px);cursor:pointer;box-shadow:0 6px 0 var(--line)}
.merge{position:relative;display:flex;align-items:flex-end;width:min(100%,560px);height:clamp(190px,36vmin,280px);margin-top:8px}
.mg-l{position:relative;z-index:2;flex:none;width:clamp(96px,22vmin,140px);aspect-ratio:1;border:0;border-radius:24px;background:var(--paper);display:grid;place-items:center;font:900 clamp(60px,14vmin,96px)/1 var(--f-body);box-shadow:0 7px 0 var(--line-strong)}
.mg-c{align-self:flex-start;cursor:pointer;box-shadow:0 7px 0 var(--line-strong),0 0 0 5px var(--sun);transition:transform .75s cubic-bezier(.5,0,.3,1.25)}
.mg-path{flex:1;align-self:stretch;margin:50px -6px 40px;background:linear-gradient(to bottom right,transparent calc(50% - 4px),var(--ink-soft) calc(50% - 4px),var(--ink-soft) calc(50% + 4px),transparent calc(50% + 4px));opacity:.3;border-radius:8px}
.merge.joined .mg-path{opacity:0}
.merge.joined .mg-c{box-shadow:0 7px 0 var(--line-strong)}
.merge-syl{margin:0;min-height:1.1em;font:900 clamp(52px,12vmin,84px)/1 var(--f-body);letter-spacing:.06em}
.rw-word{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:6px}
.syl-chip{border:0;border-radius:20px;background:var(--paper);padding:10px 16px 14px;font:900 clamp(44px,10vmin,72px)/1 var(--f-body);letter-spacing:.04em;cursor:pointer;box-shadow:0 6px 0 var(--line-strong),inset 0 -8px 0 var(--chipc)}
.syl-dash{font:900 40px var(--f-body);color:var(--ink-soft)}
.rw-pic{width:clamp(150px,30vmin,220px);aspect-ratio:1;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:clamp(80px,16vmin,120px);box-shadow:0 6px 0 var(--line)}
.rw-pic.open .pic{animation:popin .5s}

/* math */
.m-items{width:min(100%,520px);padding:14px;background:var(--paper);border-radius:26px;box-shadow:0 5px 0 var(--line)}
.frame{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;font-size:clamp(32px,7.5vmin,52px)}
.it{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:14px;background:var(--sky);cursor:pointer}
.it.cnt{background:var(--t-yellow)}
.it.cnt::after{content:attr(data-n);position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 4px;border-radius:99px;background:var(--leaf);color:#fff;font:900 15px/24px var(--f-body);text-align:center}
.num-opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.num-b{width:clamp(80px,19vmin,120px);aspect-ratio:1;border:0;border-radius:26px;background:var(--paper);color:var(--plum);font:900 clamp(46px,11vmin,72px)/1 var(--f-body);cursor:pointer;box-shadow:0 7px 0 var(--line-strong)}
.num-b.right{background:var(--t-green);color:var(--leaf);box-shadow:0 7px 0 var(--leaf)}
.dots-row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:44px;font-size:34px}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.grp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:96px;min-height:120px;padding:10px;background:var(--paper);border-radius:20px;box-shadow:0 5px 0 var(--line)}
.grp .gi{display:grid;grid-template-columns:repeat(3,auto);gap:2px;font-size:clamp(26px,6vmin,40px)}
.grp small{font:900 26px var(--f-body);color:var(--plum)}
.grp.q{font:900 54px var(--f-body);color:var(--ink-soft)}
.op{font:900 46px var(--f-body)}
.cmp-q{margin:0;font:700 clamp(26px,5vw,36px)/1.1 var(--f-display)}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(100%,640px)}
.cmp-g{padding:12px;border:0;border-radius:24px;background:var(--paper);cursor:pointer;box-shadow:0 6px 0 var(--line-strong)}
.cmp-g .frame{font-size:clamp(22px,5.4vmin,40px);gap:5px}
.cmp-g.right{background:var(--t-green)}
.cmp-g .cn{display:block;min-height:38px;margin-top:6px;font:900 34px/38px var(--f-body);color:var(--plum)}

/* songs & xylophone */
.song{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.song-friend{width:clamp(110px,24vmin,170px)}
.song-friend svg{width:100%;height:auto;display:block}
.song-friend.dance svg{animation:dance .6s ease-in-out infinite}
.lyrics{width:min(100%,620px);max-height:42vh;overflow-y:auto;padding:12px 20px;background:var(--paper);border-radius:26px;box-shadow:0 5px 0 var(--line)}
.ly{margin:6px 0;text-align:center;font:800 clamp(20px,4.6vw,28px)/1.4 var(--f-body)}
.sy{border-radius:8px;padding:0 1px;transition:color .15s,background-color .15s}
.sy.past{color:var(--plum)}
.sy.on{background:var(--sun);color:var(--ink)}
.song-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card-sub{font:700 13px var(--f-body);color:var(--ink-soft)}
.xy-line{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;min-height:58px;width:min(100%,620px);padding:8px 16px;background:var(--paper);border-radius:20px;font:800 clamp(20px,4.6vw,28px)/1.3 var(--f-body);box-shadow:0 4px 0 var(--line)}
.xy-line .muted{font:700 16px var(--f-body)}
.xylo{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.2vw,12px);width:min(100%,680px);flex:1;min-height:220px;max-height:420px;padding:14px 12px;background:#8B5A2B;border-radius:22px;box-shadow:inset 0 0 0 8px #6E4422}
.xbar{flex:1;height:var(--h);border:0;border-radius:14px;background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0;cursor:pointer;touch-action:none;box-shadow:inset -4px -6px 0 rgba(0,0,0,.15),0 4px 0 rgba(0,0,0,.25)}
.xbar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.75)}
.xbar span{font:900 clamp(12px,3vw,18px)/1 var(--f-body);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.xbar.glow{box-shadow:0 0 0 5px #fff,0 0 24px 10px #FFF3B0;animation:pulse .8s ease-in-out infinite}
.xy-songs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* drawing */
.paint{display:flex;flex-direction:column;gap:10px;width:100%;flex:1;min-height:0}
.paper{position:relative;flex:1;min-height:260px;overflow:hidden;background:#FFFFFF;border-radius:22px;box-shadow:0 5px 0 var(--line),inset 0 0 0 3px var(--line);touch-action:none}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#cvL{pointer-events:none}
.guide-l{position:absolute;inset:0;display:grid;place-items:center;font:900 min(34vw,36vh)/1 var(--f-body);color:#F3F0FB;-webkit-text-stroke:4px #CFC4EE;letter-spacing:.04em;pointer-events:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.swc{width:40px;height:40px;border:0;border-radius:50%;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 3px rgba(42,35,70,.15)}
.swc.sel{box-shadow:0 0 0 4px #FFFFFF,0 0 0 7px var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.tool{width:52px;height:52px;border:0;border-radius:16px;background:var(--paper);display:grid;place-items:center;font-size:24px;cursor:pointer;box-shadow:0 4px 0 var(--line-strong)}
.tool i{display:block;width:var(--d);height:var(--d);border-radius:50%;background:var(--ink)}
.tool.sel{background:var(--t-yellow);box-shadow:0 4px 0 #D39A00,inset 0 0 0 3px var(--sun)}
.tool-done{min-height:52px;padding:6px 18px;font-size:20px}
.wr-head{display:flex;align-items:center;justify-content:center;gap:14px}
.wr-ex{display:flex;align-items:center;gap:10px;font:900 26px var(--f-body);letter-spacing:.06em}
.wr-ex .pic{font-size:40px}
.draw-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(100%,520px)}
.sec-h{align-self:flex-start;margin:6px 0 0;font:700 24px/1.1 var(--f-display)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%}
.gallery img{width:100%;display:block;background:#FFFFFF;border-radius:16px;box-shadow:0 4px 0 var(--line-strong)}
.page-thumb{display:block;width:100%}
.page-thumb svg{display:block;width:100%;height:auto}
@keyframes dance{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-8px)}}
@media (max-width:560px){
  .lesson{grid-template-columns:auto minmax(0,1fr) auto}
  .l-go{grid-column:1/-1}
  .cmp{grid-template-columns:1fr}
  .cmp-g .frame{font-size:30px}
}

/* schemes, sounds, camera */
.scheme{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px 8px;background:#FFFFFF;border-radius:20px;box-shadow:0 4px 0 var(--line)}
.scheme svg{display:block;width:min(100%,320px);height:auto}
.scheme figcaption{font:700 13px var(--f-body);color:var(--ink-soft)}
.cam{position:relative;flex:none;width:min(78vw,340px,48vh);aspect-ratio:200/220;overflow:hidden;background:#1E1A2E;border:12px solid var(--sun);border-radius:50%/48%;box-shadow:0 8px 0 #D39A00}
.cam video{display:block;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-l{position:absolute;bottom:7%;left:50%;translate:-50% 0;padding:2px 12px;background:var(--paper);border-radius:99px;font:800 15px var(--f-body)}
.artic-stage.cam-on .mirror,.artic-stage.cam-on .cam{width:min(44vw,320px,40vh)}
.snd-tabs{display:flex;gap:12px;justify-content:center}
.snd-tab{width:76px;height:76px;border:0;border-radius:22px;background:var(--paper);font:900 46px/1 var(--f-body);cursor:pointer;box-shadow:0 5px 0 var(--line-strong)}
.snd-tab.sel{background:var(--t-yellow);box-shadow:0 5px 0 #D39A00,inset 0 0 0 4px var(--sun)}
.snd-steps{margin:0;padding:14px 18px 14px 40px;background:var(--paper);border-radius:20px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:6px;font:700 16px/1.4 var(--f-body)}
.snd-steps li::marker{font-weight:900;color:var(--tiger-deep)}
.ico-prof{display:block;width:96px}
.ico-prof svg{display:block;width:100%;height:auto}

/* two children, goal, together, reading speed */
.kids{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-top:6px}
.kid{display:flex;align-items:center;gap:8px;padding:6px 18px 6px 8px;border:0;border-radius:999px;background:var(--paper);font:800 18px var(--f-body);cursor:pointer;box-shadow:0 4px 0 var(--line-strong)}
.kid .chip-face{width:38px;height:38px}
.kid.sel{background:var(--t-yellow);box-shadow:0 4px 0 #D39A00,inset 0 0 0 3px var(--sun)}
.goal,.team{background:var(--paper);border-radius:26px;padding:16px;box-shadow:0 6px 0 var(--line-strong)}
.goal{display:flex;align-items:center;gap:14px;box-shadow:0 6px 0 var(--line-strong),inset 0 0 0 4px var(--plum)}
.goal-ico{font-size:52px;line-height:1}
.goal-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.goal-t b{font:700 22px/1.1 var(--f-display)}
.goal-t small{font:700 14px/1.3 var(--f-body);color:var(--ink-soft)}
.goal-bar,.chest-bar{display:block;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.goal-bar i,.chest-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--plum),var(--berry))}
.team{display:flex;flex-direction:column;gap:12px}
.team-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.team-top h2{margin:0;font:700 clamp(24px,4vw,30px)/1.1 var(--f-display)}
.team-top .muted{margin:0}
.team-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tm{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:18px;background:var(--sky);min-width:96px}
.tm.ok{background:var(--t-green)}
.tm-face{display:block;width:54px;height:54px}
.tm-face svg{width:100%;height:100%}
.tm b{font:700 17px var(--f-display)}
.tm small{font:700 13px var(--f-body);color:var(--ink-soft)}
.tm-plus{font:900 28px var(--f-body);color:var(--ink-soft)}
.chest{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px}
.chest .emo{font-size:34px;line-height:1}
.chest small{font:700 14px var(--f-body);color:var(--ink-soft)}
.team .big{align-self:flex-start}
.tiles>.tile:only-child{grid-column:1/-1}
.tw-card{width:min(100%,640px);padding:22px 24px;background:var(--paper);border-radius:28px;box-shadow:0 6px 0 var(--line);text-align:center}
.tw-n{margin:0 0 6px;font:800 15px var(--f-body);color:var(--ink-soft)}
.tw-text{margin:0;font:800 clamp(24px,5.4vw,36px)/1.35 var(--f-body);text-wrap:balance}
.tw-step{margin:12px 0 0;font:700 18px var(--f-display);color:var(--plum)}
.sy-table{display:flex;flex-direction:column;gap:8px;width:min(100%,640px)}
.sy-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sy-cell{padding:10px 4px;border:0;border-radius:16px;background:var(--paper);font:900 clamp(22px,5vw,34px)/1 var(--f-body);cursor:pointer;box-shadow:0 4px 0 var(--line-strong)}
.sp-bar{display:flex;align-items:center;justify-content:center;gap:16px}
.sp-time{min-width:96px;font:900 40px/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--plum)}
.speed{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.sp-title{margin:0;font:700 26px/1.1 var(--f-display)}
.sp-text{width:min(100%,680px);padding:18px 22px;background:var(--paper);border-radius:24px;box-shadow:0 5px 0 var(--line);font:700 clamp(19px,4.4vw,24px)/1.65 var(--f-body);transition:filter .3s}
.sp-text.wait{filter:blur(7px);user-select:none}
.sp-res{margin:0;font:700 20px var(--f-display)}
.sp-res b{font:900 44px var(--f-body);color:var(--plum)}
.wpm{margin:0;width:min(100%,560px);padding:12px 14px 8px;background:var(--paper);border-radius:22px;box-shadow:0 4px 0 var(--line)}
.wpm-bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.wpm-bars span{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.wpm-bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--sea)}
.wpm-bars span:last-child i{background:var(--plum)}
.wpm-bars b{font:800 12px var(--f-body);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.wpm figcaption{margin-top:4px;font:700 13px var(--f-body);color:var(--ink-soft);text-align:center}
.book-wrap{display:flex;flex-direction:column;gap:14px;width:min(100%,640px)}
.book-card{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--paper);border-radius:24px;box-shadow:0 5px 0 var(--line)}
.book-card div{display:flex;flex-direction:column;gap:2px}
.book-card b{font:700 22px/1.15 var(--f-display)}
.book-card small{font:700 14px var(--f-body);color:var(--ink-soft)}
.book-ico{font-size:48px;line-height:1}
.mins{display:flex;gap:8px;flex-wrap:wrap}
.chip.mn.sel{background:var(--t-yellow);box-shadow:0 5px 0 #D39A00}
.book-log .big{align-self:flex-start}
.days14{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.d14{display:flex;flex-direction:column;align-items:center;gap:2px;font:800 11px var(--f-body);color:var(--ink-soft)}
.d14 i{width:100%;aspect-ratio:1;max-width:44px;border-radius:12px;background:var(--paper);display:grid;place-items:center;font:800 14px var(--f-body);font-style:normal;color:var(--ink-soft)}
.d14.on i{background:var(--t-yellow)}
.d14 .star-i{width:70%;height:70%}
.d14.now i{box-shadow:inset 0 0 0 3px var(--plum)}
.duo{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.duo-team{display:flex;gap:14px;justify-content:center}
.duo-p{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px;border-radius:20px;background:var(--paper);opacity:.55;box-shadow:0 4px 0 var(--line)}
.duo-p.on{opacity:1;background:var(--t-yellow);box-shadow:0 4px 0 #D39A00}
.duo-p b{font:700 18px var(--f-display)}
.duo-s{font:900 26px var(--f-body);color:var(--plum)}
.duo-bar{width:min(100%,520px);height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.duo-bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--leaf),var(--sun))}
.prow select{font:700 18px var(--f-body);padding:12px 14px;border-radius:14px;border:3px solid var(--line-strong);background:#fff;color:var(--ink);width:min(100%,320px)}
.face .tg{transform-box:fill-box;transform-origin:center}
.face.turkey .tg{animation:pat .16s infinite alternate}

.el-list{display:flex;flex-direction:column;gap:8px}
.el-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--sky)}
.el-row .big{min-height:48px;padding:6px 16px;font-size:18px}
.el-row .ibtn svg{width:24px;height:24px}
.el-t{flex:1;min-width:0;display:flex;flex-direction:column}
.el-t b{font:700 18px var(--f-display)}
.el-t small{font:700 13px/1.3 var(--f-body);color:var(--ink-soft);overflow-wrap:anywhere}

/* friends */
.friends{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(100%,640px)}
@media (min-width:600px){.friends{grid-template-columns:repeat(3,minmax(0,1fr))}}
.friend{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px;border:0;border-radius:24px;background:var(--paper);cursor:pointer;box-shadow:0 6px 0 var(--line-strong)}
.friend svg{width:min(120px,100%);height:auto}
.friend b{font:700 22px/1.1 var(--f-display)}
.friend small{font:700 14px var(--f-body);color:var(--ink-soft)}
.friend.sel{background:var(--t-yellow);box-shadow:0 6px 0 #D39A00,inset 0 0 0 5px var(--sun)}
.chip-face{width:34px;height:34px;display:block}
.chip-face svg{width:100%;height:100%;display:block}
.chip.nudge{animation:pulse 1.4s ease-in-out infinite;background:var(--t-yellow)}

/* menus of exercises */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:14px;width:100%}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:160px;padding:14px 10px;border:0;border-radius:24px;background:var(--bg);font:700 18px/1.15 var(--f-display);text-align:center;cursor:pointer;box-shadow:0 6px 0 var(--line-strong)}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line-strong)}
.card .pic{font-size:62px}
.card .face{width:96px;height:96px}
.card .done{position:absolute;top:8px;right:8px}
.card .done .star-i{width:30px;height:30px}

/* breathing */
.scene{position:relative;width:100%;flex:1;min-height:250px;border-radius:28px;overflow:hidden;background:linear-gradient(#B9E5FF,#EEF9FF);box-shadow:inset 0 0 0 3px var(--line)}
.meter{width:min(100%,520px);height:16px;flex:none;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--leaf),var(--sun))}
.hold{flex:none;width:min(100%,380px);min-height:100px;border:0;border-radius:999px;background:var(--tiger);color:#fff;box-shadow:0 9px 0 var(--tiger-deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;touch-action:none;-webkit-touch-callout:none}
.hold b{font:700 34px/1 var(--f-display)}
.hold small{font:700 15px var(--f-body);opacity:.92}
.hold.on{transform:translateY(7px);box-shadow:0 2px 0 var(--tiger-deep);background:#FF9D4D}
.reps{position:absolute;top:14px;right:16px;display:flex;gap:6px}
.reps i{width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 3px var(--line-strong)}
.reps i.on{background:var(--sun);box-shadow:inset 0 0 0 3px #D39A00}
.cheeks-wrap{position:absolute;inset:0;display:grid;place-items:center}
.cheeks-wrap svg{width:min(62%,300px);height:auto;overflow:visible}
.puff{transform-box:fill-box;transform-origin:center;transform:scale(.25)}
.ryz .m-o{display:none}
.ryz.blow .m-o{display:inline}
.ryz.blow .m-flat{display:none}
.puffline{position:absolute;height:8px;border-radius:8px;background:#fff;width:70px;animation:puffline .9s ease-out forwards}
.cloud{position:absolute;top:44px;left:50%;translate:-50% 0;width:170px;height:58px;background:#fff;border-radius:40px;box-shadow:0 6px 0 rgba(42,35,70,.06)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:70px;height:70px;left:24px;top:-34px}
.cloud::after{width:88px;height:88px;right:20px;top:-46px}
.cloud.glow{animation:glow 1s ease-in-out 3}
.feather{position:absolute;left:50%;bottom:12px;font-size:clamp(60px,12vmin,96px);will-change:transform}
.cake{position:absolute;left:50%;bottom:18px;translate:-50% 0;width:min(84%,360px);display:flex;flex-direction:column;align-items:center}
.candles{display:flex;justify-content:space-around;width:68%;height:120px;align-items:flex-end}
.candle{position:relative;width:18px;height:68px;border-radius:5px;background:repeating-linear-gradient(135deg,#fff 0 8px,var(--berry) 8px 14px)}
.flame{position:absolute;left:50%;bottom:100%;width:22px;height:36px;margin-left:-11px;border-radius:50% 50% 45% 45%/62% 62% 38% 38%;background:radial-gradient(circle at 50% 72%,#FFFBD6 0 22%,#FFC83A 46%,#FF7A1A 82%);transform-origin:50% 100%;animation:flick .16s infinite alternate}
.candle.out .flame{animation:none;transform:scale(0);transition:transform .25s}

.crate-open{width:min(100%,580px);background:var(--paper);border-radius:28px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px;animation:popin .35s}

  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.winbox{width:min(100%,460px);background:var(--paper);border-radius:32px;padding:20px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:popin .45s}

@keyframes popin{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}

  .said{animation:popin .01s both!important}
}

function speakOne(text, rate) {
  return new Promise(res => {
    let done = false;
    const fin = () => { if (!done) { done = true; res(); } };
    const est = 900 + text.length * 110 / (rate * P.settings.rate);
    if (!P.settings.voice || !('speechSynthesis' in window)) { setTimeout(fin, Math.min(est, 2200)); return; }
    try {

// one sentence at a time with a pause after each, so a child can follow and repeat
async function say(text, { rate = 1 } = {}) {
  const my = ++sayTok;
  const parts = String(gx(text || '')).match(/[^.!?…]+[.!?…]*/g) || [];
  if (P.settings.voice && elOn()) {
    const jobs = parts.map(x => x.trim()).filter(Boolean).map(x => elAudio(x));
    try {
      for (let i = 0; i < jobs.length; i++) {
        const buf = await jobs[i]; if (my !== sayTok) return;
        await elPlay(buf); if (my !== sayTok) return;
        if (i < jobs.length - 1) await wait(350 * pace());
      }
      return;
    } catch (e) { if (e && (e.status === 401 || e.status === 402 || e.status === 403)) elBroken = true; if (my !== sayTok) return; }
  }
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i].trim();
    if (!p || my !== sayTok) continue;
    await speakOne(p, rate);
    if (my === sayTok && i < parts.length - 1) await wait(500 * pace());
  }
}

function fly(el, target) {

/* ---------- calendar ---------- */
function weekStrip() {
  const d = new Date(), mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7), tk = dayKey();
  return WEEK.map((w, i) => {
    const k = dayKey(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i)), on = dayTotal(k) > 0;
    return `<span class="wd ${on ? 'on' : ''} ${k === tk ? 'now' : ''}"><small>${w}</small><i>${on ? ICON.star : ''}</i></span>`;
  }).join('');
}
function screenCalendar(off = 0) {
  newScreen();
  const now = new Date(), m = new Date(now.getFullYear(), now.getMonth() + off, 1), tk = dayKey();
  const lead = (m.getDay() + 6) % 7, nd = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  let cells = '<span class="cd blank"></span>'.repeat(lead);
  for (let d = 1; d <= nd; d++) {
    const x = new Date(m.getFullYear(), m.getMonth(), d), k = dayKey(x), c = dayCounts(k), tot = dayTotal(k);
    const dots = LIDS().filter(id => c[id]).map(id => `<i style="background:${LS()[id].color}"></i>`).join('');
    cells += `<span class="cd ${tot ? 'on' : ''} ${k === tk ? 'now' : ''} ${x > now ? 'future' : ''}"><b>${d}</b>${tot ? ICON.star : ''}${tot > 1 ? `<em>×${tot}</em>` : ''}${dots ? `<span class="dots">${dots}</span>` : ''}</span>`;
  }
  const s = streak(), keys = Object.keys(P.days), mk = dayKey(m).slice(0, 7);
  const total = keys.reduce((a, k) => a + dayTotal(k), 0), inMonth = keys.filter(k => k.startsWith(mk)).reduce((a, k) => a + dayTotal(k), 0);
  shell('Мой календарь', `<div class="cal">
      <div class="cal-stats">
        <div><b>${s}</b><small>${plural(s, ['день', 'дня', 'дней'])} подряд</small></div>
        <div><b>${inMonth}</b><small>${plural(inMonth, ['занятие', 'занятия', 'занятий'])} за месяц</small></div>
        <div><b>${total}</b><small>всего занятий</small></div>
      </div>
      <div class="cal-card">
        <div class="cal-head"><button class="ibtn" id="prevM" aria-label="Предыдущий месяц">${ICON.back}</button><h2>${MONTHS[m.getMonth()]} ${m.getFullYear()}</h2><button class="ibtn" id="nextM" aria-label="Следующий месяц" ${off >= 0 ? 'disabled' : ''}>${ICON.fwd}</button></div>
        <div class="cal-grid">${WEEK.map(w => `<span class="cw">${w}</span>`).join('')}${cells}</div>
        <div class="cal-legend">${LIDS().map(id => `<span><i style="background:${LS()[id].color}"></i>${LS()[id].name}</span>`).join('')}</div>
      </div>
      <div class="medals">${MEDALS.map(md => `<div class="medal ${P.medals.includes(md.n) ? 'got' : ''}"><span class="emo">${md.e}</span><small>${md.t}</small></div>`).join('')}</div>
      <button class="big" id="calGo">${ICON.play}${dayTotal(tk) ? 'Заниматься ещё' : 'Заниматься сегодня'}</button>
    </div>`);
  $('#prevM').onclick = () => { sfx.pop(); screenCalendar(off - 1); };
  $('#nextM').onclick = () => { if (off < 0) { sfx.pop(); screenCalendar(off + 1); } };
  $('#calGo').onclick = () => { sfx.pop(); goHome(); };
  const today = dayTotal(tk);
  if (off === 0) talk(today ? `Сегодня ты позанималась ${today} ${plural(today, ['раз', 'раза', 'раз'])}${nameBit()}! За каждый день — звёздочка в календаре.` : 'Каждый день, когда ты занимаешься, здесь появляется звёздочка. За три, семь, четырнадцать и тридцать дней подряд — медали!');

}

function breathDone(id) {
  const i = BREATH.findIndex(x => x.id === id);
  const nx = BREATH[i + 1];
  finish({ key: 'breath:' + id, stars: 1, line: 'Хорошо подула!', again: () => BREATH_RUN[id](), next: nx ? () => BREATH_RUN[nx.id]() : null, menu: screenBreathMenu });
}
const setMeter = v => { const m = $('#meter'); if (m) m.style.width = Math.max(0, Math.min(100, v * 100)) + '%'; };
const BREATH_RUN = {
  cheeks() {
    const t = newScreen();
    breathShell('cheeks', `<div class="cheeks-wrap">${friendSVG('puffy')}</div><div class="reps" id="reps"><i></i><i></i><i></i></div>`, 'Держу щёчки', 'отпущу — и выдохну: пфф!');
    const ryz = $('#scene .ryz'), puffs = $$('#scene .puff'), sc = $('#scene');
    let holding = false, puff = 0, reps = 0, over = false;
    talk('Сначала вдохни носом. Надуй щёчки, как шарик. Нажми оранжевую кнопку и держи. Отпусти кнопку. И выдохни ртом: пфф!');
    bindHold($('#hold'), () => { if (!over) { holding = true; ryz.classList.remove('blow'); } }, () => {
      if (!holding) return; holding = false;
      if (puff > .85) {
        reps++; $$('#reps i')[reps - 1].classList.add('on');
        ryz.classList.add('blow'); sfx.whoosh(.5, .22);
        for (let k = 0; k < 3; k++) { const l = document.createElement('i'); l.className = 'puffline'; l.style.left = '56%'; l.style.top = (54 + k * 6) + '%'; l.style.animationDelay = k * .08 + 's'; sc.append(l); setTimeout(() => l.remove(), 1200); }
        later(() => ryz.classList.remove('blow'), 800);
        if (reps >= 3) { over = true; talk('Пфф! Вот это щёчки!'); later(() => breathDone('cheeks'), 1300); }
        else talk(reps === 1 ? 'Пфф! Отлично! Ещё раз!' : 'Здорово! И последний раз!');
      } else talk('Подержи щёчки подольше!');
    });
    loop(t, dt => {

function screenCount() {
  const t = newScreen();
  const types = CNT.map(c => ({ ...c, n: ri(2, 5), found: 0 }));
  const byId = id => types.find(x => x.id === id);
  const all = shuffle(types.flatMap(c => Array.from({ length: c.n }, () => c.id)));
  const order = shuffle(types.map(c => c.id));
  let cur = 0, busy = false;
  shell('Найди и посчитай', `<div class="field" id="field">${all.map(id => `<button class="fi" data-id="${id}" aria-label="${byId(id).f[0]}">${pic(byId(id).e)}</button>`).join('')}</div>
    <div class="tray" id="tray">${types.map(c => `<div class="slot" data-id="${c.id}">${pic(c.e)}<b></b></div>`).join('')}</div>`);
  const field = $('#field'), btns = $$('.fi', field);
  const perm = shuffle(Array.from({ length: 400 }, (_, i) => i));
  const meta = btns.map(() => ({ jx: rnd(-.12, .12), jy: rnd(-.12, .12), s: rnd(.74, .98), r: rnd(-22, 22) }));
  function layout() {
    const Wd = field.clientWidth, Ht = field.clientHeight, N = btns.length;
    if (!Wd || !Ht) return;
    const cols = Math.max(3, Math.round(Math.sqrt(N * 1.15 * Wd / Ht))), rows = Math.ceil(N * 1.15 / cols);
    const cw = Wd / cols, ch = Ht / rows, cells = perm.filter(x => x < cols * rows).slice(0, N);
    btns.forEach((b, i) => {
      const c = cells[i], m = meta[i], size = Math.min(cw, ch) * m.s / 1.2;
      const x = ((c % cols) + .5 + m.jx) * cw, y = (Math.floor(c / cols) + .5 + m.jy) * ch;
      Object.assign(b.style, { fontSize: size + 'px', left: (x - size * .6) + 'px', top: (y - size * .6) + 'px', transform: `rotate(${m.r}deg)` });
    });
  }
  layout(); resizeFn = layout;
  const markSlot = () => $$('.slot').forEach(s => s.classList.toggle('cur', s.dataset.id === order[cur]));
  markSlot();
  talk(`${byId(order[0]).find} Нажимай на каждую картинку. Я буду считать.`);
  const phrase = (n, c) => cap(`${numW(n, c.g)} ${plural(n, c.f)}`);
  field.onclick = e => {
    const b = e.target.closest('.fi'); if (!b || busy || b.classList.contains('found')) return;
    const c = byId(b.dataset.id), want = byId(order[cur]);
    if (c.id !== want.id) { wiggle(b); sfx.oops(); talk(`Это ${c.f[0]}. ${want.find}`); return; }
    c.found++; b.classList.add('found'); b.insertAdjacentHTML('beforeend', `<em>${c.found}</em>`); sfx.pop();
    if (c.found < c.n) { talk(phrase(c.found, c) + '!'); return; }
    busy = true;
    talk(`${phrase(c.found, c)}! Всех нашла!`).then(() => {
      if (t !== tok) return;
      const slot = $(`.slot[data-id="${c.id}"]`); slot.classList.add('done'); slot.querySelector('b').textContent = c.n; sfx.good();
      cur++;
      if (cur >= order.length) { later(() => finish({ key: 'count', line: 'Ты всё нашла и посчитала!', again: screenCount }), 500); return; }
      busy = false; markSlot();
      talk(`${pickOne(['Молодец!', 'Верно!', 'Отлично!'])} ${byId(order[cur]).find}`);
    });
  };
}

function songTokens(sg) {

  const bus = musicBus(); if (!bus) { if (onEnd) later(onEnd, 300); return; }

/* the book diary and the goal (e.g. a present for the birthday) */
const bookDays = () => Object.keys(P.book.log).sort();
function bookStreak() { const d = new Date(); if (!P.book.log[dayKey(d)]) d.setDate(d.getDate() - 1); let n = 0; while (P.book.log[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
function goalCard() {
  const g = P.goal; if (!g || !g.title) return '';
  if (!g.start) { g.start = dayKey(); save(); }
  const day0 = s => new Date(s + 'T00:00:00'), now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const read = bookDays().filter(k => k >= g.start).length, passed = Math.round((today - day0(g.start)) / 864e5) + 1;
  const missed = Math.max(0, passed - read - (P.book.log[dayKey()] ? 0 : 1));
  const left = g.date ? Math.max(0, Math.round((day0(g.date) - today) / 864e5)) : null;
  const total = g.date ? Math.max(1, Math.round((day0(g.date) - day0(g.start)) / 864e5)) : 0;
  return `<section class="goal">
    <span class="emo goal-ico">🎮</span>
    <div class="goal-t"><b>Цель: ${esc(g.title)}</b>
      <small>${left !== null ? `до дня рождения ${left} ${plural(left, ['день', 'дня', 'дней'])}` : 'дату дня рождения укажите в «Для взрослых»'} · читаем каждый день</small>
      <span class="goal-bar"><i style="width:${total ? Math.min(100, read / total * 100) : 0}%"></i></span>
      <small>прочитано ${read} ${plural(read, ['день', 'дня', 'дней'])}${missed ? ` · пропущено ${missed}` : ' · без пропусков!'}${bookStreak() > 1 ? ` · ${bookStreak()} подряд` : ''}</small>
    </div></section>`;
}

  $('#logBtn').onclick = () => {

/* ---------- ElevenLabs voice: optional, the key stays on this device; phrases are cached ---------- */
const EMBEDDED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
let elBroken = false, elSrc = null;
const elMem = new Map();
const elOn = () => !EMBEDDED && !elBroken && ROOT.eleven.key && ROOT.eleven.voice && navigator.onLine !== false;
const decode = buf => new Promise((res, rej) => ac().decodeAudioData(buf, res, rej));
function elAudio(text) {
  const { key, voice } = ROOT.eleven, speed = P.settings.rate < 1 ? .8 : .9, id = `${voice}|${speed}|${text}`;
  if (elMem.has(id)) return elMem.get(id);
  const job = (async () => {
    const url = 'https://voice.cache/' + encodeURIComponent(id);
    let cache = null; try { cache = await caches.open('govorilki-voice'); } catch (e) {}
    const hit = cache && await cache.match(url);
    if (hit) return decode(await hit.arrayBuffer());
    const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(voice)}?output_format=mp3_44100_64`, {
      method: 'POST', headers: { 'xi-api-key': key, 'Content-Type': 'application/json', Accept: 'audio/mpeg' },
      body: JSON.stringify({ text, model_id: 'eleven_multilingual_v2', voice_settings: { stability: .55, similarity_boost: .75, speed } })
    });
    if (!r.ok) { const err = new Error('elevenlabs ' + r.status); err.status = r.status; throw err; }
    const buf = await r.arrayBuffer();
    if (cache) { try { await cache.put(url, new Response(buf.slice(0), { headers: { 'Content-Type': 'audio/mpeg' } })); } catch (e) {} }
    return decode(buf);
  })();
  elMem.set(id, job); job.catch(() => elMem.delete(id));
  return job;
}
function elStop() { if (elSrc) { try { elSrc.stop(); } catch (e) {} elSrc = null; } }
function elPlay(buffer) {
  return new Promise(res => {
    const a = ac(); if (!a) { res(); return; }
    elStop(); const s = a.createBufferSource(); s.buffer = buffer; s.connect(a.destination);
    s.onended = () => { if (elSrc === s) elSrc = null; res(); };
    elSrc = s; s.start();
  });
}

      const q = $('#elFind').value.trim(), box = $('#elList');
      if (!ROOT.eleven.key) { st('Сначала вставьте ключ API.'); return; }
      if (!q) { st('Впишите имя голоса, например Hope.'); return; }
      st(`Ищу «${q}»…`); box.innerHTML = '';
      const h = { 'xi-api-key': ROOT.eleven.key }, found = [];
      try {
        const r = await fetch('https://api.elevenlabs.io/v1/voices', { headers: h });
        if (r.status === 401) { st('Ключ не подошёл. Проверьте его в ElevenLabs.'); return; }
        if (r.ok) ((await r.json()).voices || []).filter(v => v.name.toLowerCase().includes(q.toLowerCase())).forEach(v => found.push({ id: v.voice_id, name: v.name, mine: 1, meta: [v.labels && v.labels.accent, v.labels && v.labels.gender].filter(Boolean).join(' · '), preview: v.preview_url }));
      } catch (e) {}
      try {
        const r = await fetch(`https://api.elevenlabs.io/v1/shared-voices?page_size=12&search=${encodeURIComponent(q)}`, { headers: h });
        if (r.ok) ((await r.json()).voices || []).forEach(v => { if (!found.some(f => f.id === v.voice_id)) found.push({ id: v.voice_id, owner: v.public_owner_id, name: v.name, meta: [v.language, v.accent, v.gender, v.descriptive].filter(Boolean).join(' · '), preview: v.preview_url }); });
      } catch (e) {}
      if (!found.length) { st(`Голос «${q}» не найден. Проверьте имя или добавьте голос в «Мои голоса» на сайте ElevenLabs.`); return; }
      st('Нажмите ▶, чтобы послушать, и «Выбрать».');
      box.innerHTML = found.map((v, i) => `<div class="el-row"><div class="el-t"><b>${esc(v.name)}</b><small>${esc(v.meta || '')}${v.mine ? ' · в моих голосах' : ' · из библиотеки'}</small></div>${v.preview ? `<button class="ibtn" data-play="${i}" aria-label="Послушать">${ICON.play}</button>` : ''}<button class="big ghost" data-pick="${i}">Выбрать</button></div>`).join('');
      let audio = null;
      box.onclick = async ev => {
        const pl = ev.target.closest('[data-play]'), pk = ev.target.closest('[data-pick]');
        if (pl) { if (audio) audio.pause(); audio = new Audio(found[+pl.dataset.play].preview); audio.play().catch(() => st('Не получилось включить пример.')); return; }
        if (!pk) return;
        const v = found[+pk.dataset.pick];
        if (v.mine) { pickVoice(v.id, v.name); return; }
        st(`Добавляю ${v.name} в ваши голоса…`);
        try {
          const r = await fetch(`https://api.elevenlabs.io/v1/voices/add/${encodeURIComponent(v.owner)}/${encodeURIComponent(v.id)}`, { method: 'POST', headers: { ...h, 'Content-Type': 'application/json' }, body: JSON.stringify({ new_name: v.name }) });
          if (!r.ok) { st(`ElevenLabs не дал добавить голос (ошибка ${r.status}). Добавьте ${v.name} в «Мои голоса» на сайте, затем нажмите «Найти голос».`); return; }
          const j = await r.json(); pickVoice(j.voice_id || v.id, v.name);
        } catch (e) { st('Не получилось связаться с ElevenLabs. Проверьте интернет.'); }
      };
    };
    $('#elVoice').onchange = e => { ROOT.eleven.voice = e.target.value; ROOT.eleven.voiceName = e.target.selectedOptions[0] ? e.target.selectedOptions[0].textContent : ''; elBroken = false; save(); st('Голос выбран.'); };
    $('#elTest').onclick = async () => {
      if (!ROOT.eleven.key || !ROOT.eleven.voice) { st('Вставьте ключ и выберите голос.'); return; }
      elBroken = false; st('Проверяю…');
      try { await elAudio('Привет! Я буду говорить этим голосом.'); st('Работает! Теперь друг говорит голосом ElevenLabs.'); say('Привет! Я буду говорить этим голосом.'); }
      catch (e) { st(e && e.status === 401 ? 'Ключ не подошёл.' : e && e.status === 402 ? 'На счёте ElevenLabs закончились символы.' : 'Не получилось. Проверьте ключ, голос и интернет.'); }
    };
    $('#elOff').onclick = () => { ROOT.eleven = { key: '', voice: '', voiceName: '' }; save(); screenParents(); };
  }
}

/* ---------- start ---------- */
goHome();
})();
</script>

// a new version takes over right away: reload once when the updated worker starts controlling the page
if ('serviceWorker' in navigator) {
  const had = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloaded) { reloaded = true; location.reload(); } });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {}));
}
</script>
