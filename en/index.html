<script>
/* MOVE-BEGIN */
/* The move to govorilki.com. The game used to live at yankona.github.io/govorilki; a browser keeps each address's data
   apart, so the old page packs this phone's progress (every govorilki-* key) and opens the new address with it:
   small progress rides in the link itself (#move=z…), bigger goes through the sign-in server encrypted with a key that
   stays in the link (#move=c<id>.<key>; the server keeps only the cipher, gives it out once, forgets it in a day).
   The new page unpacks it, adds what it does not have yet and reloads. the old links (a grandparent's entry, the family link, #login, games, battles) open the game on the new address,
   and someone new gets the game's first page there.
   Not in the artifact (an iframe) and not in the ?demo sandbox. While a move runs, the game itself does not start. */
(function () {
  var FROM = 'yankona.github.io', TO = 'https://govorilki.com/play/', CLOUD_TO = 'https://govorilki-cloud.yankona.workers.dev';
  var INLINE_MAX = 48000, h = location.hash || '';
  try { if (window.self !== window.top) return; } catch (e) { return; }
  var b64u = function (u8) { var s = ''; for (var i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  var unb64u = function (s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var pipe = function (u8, T) { return new Response(new Blob([u8]).stream().pipeThrough(T)).arrayBuffer().then(function (b) { return new Uint8Array(b); }); };
  var wait = function () {
    var show = function () { if (!document.body) return setTimeout(show, 20); var d = document.createElement('div'); d.id = 'gvMove'; d.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#CDEEF6;color:#2A2346;font:800 20px/1.3 system-ui,sans-serif;text-align:center;padding:24px'; d.innerHTML = '<div style="font-size:54px">🚚 ⭐</div><div>govorilki.com</div>'; document.body.appendChild(d); };
    show();
  };
  // the new address: unpack what the old one sent
  var m = h.match(/[#&]move=([A-Za-z0-9_.-]+)/);
  if (m && location.hostname !== FROM) {
    window.__GV_HOLD = true; wait();
    var rest = h.replace(/[#&]move=[A-Za-z0-9_.-]+/, ''); if (rest && rest[0] !== '#') rest = '#' + rest.replace(/^&/, '');
    var done = function () { location.replace(location.pathname + location.search + (rest.length > 1 ? rest : '')); };
    var take = function (keys) {
      var here = null; try { here = JSON.parse(localStorage.getItem('govorilki-v2') || 'null'); } catch (e) {}
      Object.keys(keys).forEach(function (k) {
        if (!/^govorilki/.test(k) || /demo/.test(k)) return;
        if (k === 'govorilki-v2' && here && here.profiles) {
          // this address has a family already: add the families and children it does not have; a child it has already
          // is put aside, and the game merges the two copies at its start (kidMerge), so neither copy's stars are lost
          var t; try { t = JSON.parse(keys[k]); } catch (e) { return; }
          here.families = here.families || {};
          var aside = {}, n = 0;
          Object.keys(t.families || {}).forEach(function (f) { if (!here.families[f]) here.families[f] = t.families[f]; });
          Object.keys(t.profiles || {}).forEach(function (p) { if (!here.profiles[p]) here.profiles[p] = t.profiles[p]; else { aside[p] = t.profiles[p]; n++; } });
          if (!here.curFam && t.curFam) { here.curFam = t.curFam; here.cur = t.cur; }
          try { localStorage.setItem(k, JSON.stringify(here)); } catch (e) {}
          if (n) {
            try { localStorage.setItem('govorilki-merge-in', JSON.stringify({ at: Date.now(), profiles: aside })); }
            catch (e) { try { Object.keys(aside).forEach(function (p) { aside[p] = Object.assign({}, aside[p], { art: [] }); }); localStorage.setItem('govorilki-merge-in', JSON.stringify({ at: Date.now(), profiles: aside })); } catch (x) {} }
          }
          return;
        }
        if (localStorage.getItem(k) === null) { try { localStorage.setItem(k, keys[k]); } catch (e) {} }
      });
      try { localStorage.setItem('govorilki-moved-in', String(Date.now())); } catch (e) {}
    };
    var code = m[1];
    (async function () {
      try {
        var bytes;
        if (code[0] === 'z') bytes = await pipe(unb64u(code.slice(1)), new DecompressionStream('deflate-raw'));
        else if (code[0] === 'c') {
          var parts = code.slice(1).split('.'), r = await fetch(CLOUD_TO + '/v1/move/' + parts[0]), j = await r.json();
          if (!j.ok) throw new Error('gone');
          var raw = unb64u(j.data), key = await crypto.subtle.importKey('raw', unb64u(parts[1]), 'AES-GCM', false, ['decrypt']);
          var plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.subarray(0, 12) }, key, raw.subarray(12)));
          bytes = await pipe(plain, new DecompressionStream('deflate-raw'));
        }
        var data = JSON.parse(new TextDecoder().decode(bytes));
        if (data && data.v === 1 && data.keys) take(data.keys);
      } catch (e) { try { localStorage.setItem('govorilki-move-failed', String(Date.now())); } catch (x) {} }
      done();
    })();
    return;
  }
  if (location.hostname !== FROM) return;
  // the old address: everything goes to govorilki.com
  window.__GV_HOLD = true; wait();
  var lang = (location.pathname.match(/\/(ru|pt|en)\/(index\.html)?$/) || [])[1] || '';
  var path = lang && lang !== 'en' ? lang + '/' : '';
  var demo = /[?&]demo\b/.test(location.search);
  var keys = {}, has = false;
  try {
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (/^govorilki/.test(k) && !/demo/.test(k)) keys[k] = localStorage.getItem(k); }
    var root = JSON.parse(keys['govorilki-v2'] || 'null');
    has = !!(root && root.families && Object.keys(root.families).length) || !!keys['govorilki-guest'] || !!keys['govorilki-ryzhik-v1'];
  } catch (e) {}
  var go = function (u) { location.replace(u); };
  if (demo || !has) {
    // nothing to carry: the game on the new address (someone new sees its first page; our links open their place)
    go(TO + path + location.search + h);
    return;
  }
  var dest = function (code) { return TO + path + location.search + (h.length > 1 ? h + '&' : '#') + 'move=' + code; };
  (async function () {
    try {
      var pack = async function (ks) { return pipe(new TextEncoder().encode(JSON.stringify({ v: 1, at: Date.now(), keys: ks })), new CompressionStream('deflate-raw')); };
      var z = await pack(keys);
      if (z.length * 4 / 3 <= INLINE_MAX) return go(dest('z' + b64u(z)));
      // bigger: encrypted through the server; drawings stay behind if even that is too big
      if (z.length > 1.3e6) {
        try { var r0 = JSON.parse(keys['govorilki-v2']); Object.keys(r0.profiles || {}).forEach(function (p) { r0.profiles[p].art = []; }); keys['govorilki-v2'] = JSON.stringify(r0); z = await pack(keys); } catch (e) {}
      }
      var key = crypto.getRandomValues(new Uint8Array(32)), iv = crypto.getRandomValues(new Uint8Array(12));
      var ck = await crypto.subtle.importKey('raw', key, 'AES-GCM', false, ['encrypt']);
      var ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, ck, z));
      var all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
      var res = await fetch(CLOUD_TO + '/v1/move', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: b64u(all) }) });
      var j = await res.json();
      if (!j.ok) throw new Error('server');
      go(dest('c' + j.id + '.' + b64u(key)));
    } catch (e) {
      // the server is out of reach: carry what fits in the link (without the drawings)
      try {
        var r1 = JSON.parse(keys['govorilki-v2'] || 'null'); if (r1) { Object.keys(r1.profiles || {}).forEach(function (p) { r1.profiles[p].art = []; }); keys['govorilki-v2'] = JSON.stringify(r1); }
        var z2 = await pipe(new TextEncoder().encode(JSON.stringify({ v: 1, at: Date.now(), keys: keys })), new CompressionStream('deflate-raw'));
        go(dest('z' + b64u(z2)));
      } catch (x) { go(TO + path + location.search + h); }
    }
  })();
})();
/* MOVE-END */
</script>
<style>
/* Layout: an island of big pastel "stations"; each opens a full-height stage where the tiger cub Рыжик speaks from the bottom bar.
   One bright daytime world on purpose (a children's game), so there is no dark palette. */
:root{
  --sky:#CDEEF6; --ink:#2A2346; --ink-soft:#5E5683; --paper:#FFFFFF;
  --tiger:#FF8A2A; --tiger-deep:#D9640C; --berry:#EF4F7E; --leaf:#2FA865; --sun:#FFC83A; --sea:#3D8BFD; --plum:#8C6CF2;
  --t-blue:#DCEDFF; --t-green:#E3F5D0; --t-peach:#FFE6CC; --t-lilac:#ECE3FF; --t-pink:#FFE0E8; --t-yellow:#FFF1BF; --t-mint:#D4F3E8;
  --line:rgba(42,35,70,.12); --line-strong:rgba(42,35,70,.2); --shade:rgba(42,35,70,.45);
  --f-display:"Balsamiq Sans","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;overflow:hidden;color:var(--ink);font:700 18px/1.35 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-tap-highlight-color:transparent;
  background-color:var(--sky);
  background-image:
    radial-gradient(ellipse 160px 46px at 12% 9%,rgba(255,255,255,.9) 70%,transparent 72%),
    radial-gradient(ellipse 110px 34px at 18% 6%,rgba(255,255,255,.9) 70%,transparent 72%),
    radial-gradient(ellipse 190px 50px at 86% 15%,rgba(255,255,255,.75) 70%,transparent 72%),
    radial-gradient(ellipse 130px 40px at 92% 11%,rgba(255,255,255,.75) 70%,transparent 72%),
    radial-gradient(ellipse 140px 40px at 60% 92%,rgba(255,255,255,.55) 70%,transparent 72%);
  background-attachment:fixed}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--sea);outline-offset:3px}
h1,h2{text-wrap:balance}
.emo,.pic.emo{font-family:var(--f-emoji);font-weight:400}
.pic{display:inline-grid;place-items:center;width:1.2em;height:1.2em;line-height:1;flex:none}
.pic svg{width:100%;height:100%;display:block}
.fe-bd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.fe-bday{font:700 18px var(--f-body);padding:10px 12px;border-radius:14px;border:3px solid var(--line-strong);background:#fff;color:#2A2346;min-height:48px}.fe-agen{font:800 18px var(--f-body);color:var(--ink)}
.fe-agealt{margin-top:8px}.fe-agealt>summary{font:700 15px var(--f-body);color:var(--ink-soft);cursor:pointer;min-height:36px;display:flex;align-items:center}
.emo.drawn{display:inline-grid;place-items:center}.emo.drawn svg{width:1.15em;height:1.15em;display:block}
b.r{color:var(--berry)}

#app{height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px 6px}
.bar h1{margin:0;flex:1;min-width:0;font:700 clamp(21px,4.4vw,30px)/1.1 var(--f-display)}
.ibtn{width:56px;height:56px;flex:none;border:0;border-radius:18px;background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 var(--line-strong)}
.ibtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line-strong)}
.starpill{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:8px 16px 8px 10px;font:900 22px/1 var(--f-body);box-shadow:0 5px 0 var(--line-strong);font-variant-numeric:tabular-nums;flex:none}
.star-i{width:28px;height:28px;display:block}
.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:8px 12px}
.stage.scroll{align-items:stretch;gap:22px}
.lead{margin:0;text-align:center;color:var(--ink-soft);max-width:36em}

.guide{display:flex;align-items:center;gap:10px;padding-block:6px 12px}
.guide-ryz{width:66px;height:66px;flex:none;border:0;padding:0;background:none;cursor:pointer}
.guide-ryz svg{width:100%;height:100%}
.guide-ryz.talking svg{animation:bob .7s ease-in-out 2}
.bubble{position:relative;flex:1;min-width:0;margin:0;background:var(--paper);border-radius:20px;padding:10px 16px 0;border-bottom:10px solid var(--paper);font:700 17px/1.3 var(--f-body);box-shadow:0 4px 0 var(--line);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
.bubble.more{cursor:pointer;padding-right:34px}
.bubble.more::after{content:'▾';position:absolute;right:10px;bottom:1px;width:20px;height:20px;border-radius:50%;background:var(--sun);color:var(--ink);font:900 13px/20px var(--f-body);text-align:center}
.bubble.open{display:block;-webkit-line-clamp:unset;line-clamp:unset;max-height:42vh;overflow-y:auto}
@media (max-height:780px){.guide{padding-block:4px 8px;gap:8px}.guide-ryz{width:52px;height:52px}.guide .ibtn{width:46px;height:46px}.bubble{font-size:16px;padding:8px 14px 0;border-bottom-width:8px;-webkit-line-clamp:2;line-clamp:2}}
.guide .bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--paper);border-left:0}

/* buttons */
.big{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:62px;padding:10px 26px;border:0;border-radius:999px;background:var(--tiger);color:#fff;font:700 24px/1.1 var(--f-display);box-shadow:0 7px 0 var(--tiger-deep);cursor:pointer}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--tiger-deep)}
.big{align-self:center;justify-self:center;max-width:100%}
.lg-cta{align-self:center;justify-self:center;width:auto!important;max-width:min(100%,340px)}
.home-b{width:48px;height:48px;margin-left:-4px}
.big.ghost{background:var(--paper);color:var(--ink);box-shadow:0 7px 0 var(--line-strong)}
.big.danger{background:var(--berry);color:#fff;box-shadow:0 7px 0 #B8305A}
.big.ghost.danger{background:var(--paper);color:var(--berry);box-shadow:0 7px 0 var(--line-strong)}
.big svg{width:28px;height:28px}
.said{position:fixed;z-index:45;left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);bottom:calc(env(safe-area-inset-bottom,0px) + var(--guide-h,96px) + 10px);display:flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 30px 14px 18px;background:var(--sun);color:var(--ink);font:700 28px/1 var(--f-display);box-shadow:0 7px 0 #D39A00,0 14px 30px rgba(42,35,70,.25);cursor:pointer;animation:popin .4s both,pulse 1.6s .5s ease-in-out infinite}
.said .star-i{width:40px;height:40px}
.said:active{box-shadow:0 2px 0 #D39A00}

/* home */
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:12px}
.hero-ryz{width:clamp(104px,22vw,150px);aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;flex:none}
.hero-ryz svg{width:100%;height:100%;animation:bob 3s ease-in-out infinite}
.hero-text{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}
.logo{margin:0;font:700 clamp(36px,8vw,58px)/.95 var(--f-display);letter-spacing:.01em}
.logo .lt{display:inline-block}.logo .lt::before{content:attr(data-c)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.logo .lt:nth-child(4n+1){color:var(--tiger-deep);transform:rotate(-4deg)}
.logo .lt:nth-child(4n+2){color:var(--berry);transform:translateY(-3px) rotate(3deg)}
.logo .lt:nth-child(4n+3){color:var(--sea);transform:rotate(-2deg)}
.logo .lt:nth-child(4n){color:var(--leaf);transform:translateY(2px) rotate(4deg)}
.logo .sub{display:block;font-size:.5em;color:var(--ink);margin-top:6px;letter-spacing:.02em}
.hero .bubble{flex:none;max-width:34em}
.hero .bubble::before{content:"";position:absolute;left:-10px;top:18px;border:10px solid transparent;border-right-color:var(--paper);border-left:0}
.hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.chip{display:flex;align-items:center;gap:8px;border:0;border-radius:18px;background:var(--paper);padding:8px 16px 8px 10px;font:800 17px var(--f-body);cursor:pointer;box-shadow:0 5px 0 var(--line-strong)}
.chip .emo{font-size:30px;line-height:1}
.chip{white-space:nowrap}
.group{display:flex;flex-direction:column;gap:12px}
.group-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.group-head h2{margin:0;font:700 clamp(24px,4vw,30px)/1.1 var(--f-display)}
.group-head p{margin:0;color:var(--ink-soft);font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tiles>.tile:last-child:nth-child(odd){grid-column:span 2}
@media (min-width:760px){
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tiles>.tile:last-child:nth-child(odd){grid-column:auto}
  .tiles.warm>.tile,.tiles>.tile:last-child:nth-child(4n+3),.tiles>.tile:last-child:nth-child(4n+2),.tiles>.tile:nth-last-child(2):nth-child(4n+1){grid-column:span 2}
}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:178px;padding:14px 14px 14px;border:0;border-radius:26px;background:var(--bg);text-align:left;cursor:pointer;box-shadow:0 7px 0 var(--line-strong)}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 var(--line-strong)}
.tile-ico{font-size:60px;height:76px;display:flex;align-items:center}
.tile-ico .face{width:76px;height:76px}
.tile b{font:700 20px/1.12 var(--f-display)}
.tile small{color:var(--ink-soft);font:700 14px/1.25 var(--f-body)}
.tile .prog{margin-top:auto;display:flex;align-items:center;gap:2px;font:800 14px var(--f-body);color:var(--ink-soft);padding-top:6px}
.prog .star-i{width:20px;height:20px}
.prog .off{opacity:.25;filter:grayscale(1)}
.syl-ico{display:flex;gap:4px}
.syl-ico i{font:900 15px/1 var(--f-body);font-style:normal;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:inset -3px -4px 0 rgba(0,0,0,.12)}

.lt-b.right{background:var(--t-green);box-shadow:0 7px 0 var(--leaf)}
.lq{flex:none;display:flex;align-items:center;gap:8px;width:min(100%,520px);padding:6px 10px;border-radius:24px;background:var(--paper);box-shadow:0 4px 0 var(--line)}

@keyframes lqwin{50%{transform:scale(1.5) rotate(-10deg)}}

@media (prefers-reduced-motion:reduce){.lq-hint,.lq.won .lq-goal{animation:none}}
.fl-pic{width:clamp(150px,32vmin,230px);aspect-ratio:1;border:0;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:clamp(90px,20vmin,150px);cursor:pointer;box-shadow:0 6px 0 var(--line)}
.merge{position:relative;display:flex;align-items:flex-end;width:min(100%,560px);height:clamp(190px,36vmin,280px);margin-top:8px}
.mg-l{position:relative;z-index:2;flex:none;width:clamp(96px,22vmin,140px);aspect-ratio:1;border:0;border-radius:24px;background:var(--paper);display:grid;place-items:center;font:900 clamp(60px,14vmin,96px)/1 var(--f-body);box-shadow:0 7px 0 var(--line-strong)}
.mg-c{align-self:flex-start;cursor:pointer;box-shadow:0 7px 0 var(--line-strong),0 0 0 5px var(--sun);transition:transform .75s cubic-bezier(.5,0,.3,1.25)}
.mg-path{flex:1;align-self:stretch;margin:50px -6px 40px;background:linear-gradient(to bottom right,transparent calc(50% - 4px),var(--ink-soft) calc(50% - 4px),var(--ink-soft) calc(50% + 4px),transparent calc(50% + 4px));opacity:.3;border-radius:8px}
.merge.joined .mg-path{opacity:0}
.merge.joined .mg-c{box-shadow:0 7px 0 var(--line-strong)}
.say-own{margin-top:14px}.say-own h3{margin:0 0 4px;font:900 18px var(--f-head)}
.say-own input{flex:1;min-width:0;font:700 18px var(--f-body);padding:10px 12px;border-radius:12px;border:2px solid var(--line-strong)}
.say-list{display:flex;flex-wrap:wrap;gap:8px}.say-w{display:inline-flex;align-items:center;gap:2px;background:var(--paper);border-radius:12px;box-shadow:0 2px 0 var(--line-strong)}
.say-play,.say-del{border:0;background:none;font:800 16px var(--f-body);padding:8px 10px;cursor:pointer;color:var(--ink)}.say-del{color:var(--ink-soft);font-size:20px;padding:4px 10px}
.ml-tr{display:block;font:700 12px var(--f-body);color:var(--ink-soft);margin-top:1px}
.cmp-fxs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}.cmp-fxs:empty{display:none}.cmp-fx{text-decoration:none;white-space:normal;max-width:100%;text-align:left;line-height:1.25}
.cmp-t.hint{box-shadow:0 0 0 3px var(--sun,#FFC94A)}
.pr{display:flex;flex-direction:column;gap:12px;align-items:center;width:min(100%,620px)}.pr-note{margin:0;font:700 15px/1.35 var(--f-body);color:var(--ink-soft);text-align:center}
.pr-path{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;width:100%}

.pr-l.v{color:#E53935}.pr-l.c{color:#1E63D6}.pr-l.s{color:var(--ink-soft)}.pr-l.later{opacity:.42}.pr-l.done{background:#E3F6E8}

.pr-steps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.pr-steps span{font:800 12px var(--f-body);padding:4px 9px;border-radius:999px;background:var(--paper);color:var(--ink-soft);opacity:.7}

.pr-big{font-size:110px;line-height:1;cursor:pointer}.pr-q .pr-big{font-size:34px;display:inline}.pr-hint{margin:0;font:800 19px/1.3 var(--f-body)}

.pr-sent{margin:0;font:800 30px/1.5 var(--f-body)}.pr-w{border:0;background:none;font:inherit;color:inherit;padding:0 2px;border-radius:8px;cursor:pointer}.pr-w:active{background:#F4F1FF}
/* LOGO-CSS */.lg{display:flex;flex-direction:column;gap:12px;align-items:center;width:min(100%,620px)}

.lg-q{margin:0;font:800 20px/1.35 var(--f-body);text-align:center}.lg-note{margin:0;font:700 16px/1.35 var(--f-body);text-align:center;color:var(--ink-soft);min-height:2.7em}

.n-pair button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;border:0;border-radius:24px;background:var(--paper);color:var(--ink);font:900 clamp(54px,13vmin,84px)/1 var(--f-body);box-shadow:0 6px 0 var(--line-strong);cursor:pointer}
.n-pair button.right{background:var(--t-green)}
.n-mini{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:3px;--rw:9px}
.n-mini .n-rod{gap:1px;padding:1px;height:112px}
.n-mini .n-one{padding:1px;border-radius:3px}
.n-mini .n-one i{border-radius:2px}
.n-line{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.n-line b{display:flex;align-items:center;justify-content:center;min-width:64px;height:64px;padding:0 8px;border-radius:18px;background:var(--paper);font:900 30px/1 var(--f-body);color:var(--ink-soft);box-shadow:0 4px 0 var(--line)}
.n-line b.q{background:var(--t-yellow);color:var(--ink)}
.n-lv{margin:0;color:var(--ink-soft);font:700 16px var(--f-body)}
.n-ico{display:flex;gap:3px;align-items:flex-end}
.n-ico .n-rod{width:11px;height:62px;gap:1px;padding:1px;border-radius:4px}
.n-ico .n-rod i{border-radius:2px;box-shadow:none}
.cmp-g.right{background:var(--t-green)}
.cmp-g .cn{display:block;min-height:38px;margin-top:6px;font:900 34px/38px var(--f-body);color:var(--plum)}

/* songs & xylophone */
.song{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.song-friend{width:clamp(110px,24vmin,170px)}
.song-friend svg{width:100%;height:auto;display:block}
.song-friend.dance svg{animation:dance .6s ease-in-out infinite}
.lyrics{width:min(100%,620px);max-height:42vh;overflow-y:auto;padding:12px 20px;background:var(--paper);border-radius:26px;box-shadow:0 5px 0 var(--line)}
.ly{margin:6px 0;text-align:center;font:800 clamp(20px,4.6vw,28px)/1.4 var(--f-body)}
.sy{border-radius:8px;padding:0 1px;transition:color .15s,background-color .15s}
.sy.past{color:var(--plum)}
.sy.on{background:var(--sun);color:var(--ink)}
.song-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card-sub{font:700 13px var(--f-body);color:var(--ink-soft)}
.xy-line{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;min-height:58px;width:min(100%,620px);padding:8px 16px;background:var(--paper);border-radius:20px;font:800 clamp(20px,4.6vw,28px)/1.3 var(--f-body);box-shadow:0 4px 0 var(--line)}
.xy-line .muted{font:700 16px var(--f-body)}
.xylo{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.2vw,12px);width:min(100%,680px);flex:1;min-height:220px;max-height:420px;padding:14px 12px;background:#8B5A2B;border-radius:22px;box-shadow:inset 0 0 0 8px #6E4422}
.xbar{flex:1;height:var(--h);border:0;border-radius:14px;background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0;cursor:pointer;touch-action:none;box-shadow:inset -4px -6px 0 rgba(0,0,0,.15),0 4px 0 rgba(0,0,0,.25)}
.xbar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.75)}
.xbar span{font:900 clamp(12px,3vw,18px)/1 var(--f-body);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.xbar.glow{box-shadow:0 0 0 5px #fff,0 0 24px 10px #FFF3B0;animation:pulse .8s ease-in-out infinite}
.xy-songs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* drawing */
.paint{display:flex;flex-direction:column;gap:10px;width:100%;flex:1;min-height:0}
.paper{position:relative;flex:1;min-height:260px;overflow:hidden;background:#FFFFFF;border-radius:22px;box-shadow:0 5px 0 var(--line),inset 0 0 0 3px var(--line);touch-action:none}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#cvL{pointer-events:none}
.guide-l{position:absolute;inset:0;display:grid;place-items:center;font:900 min(34vw,36vh)/1 var(--f-body);color:#F3F0FB;-webkit-text-stroke:4px #CFC4EE;letter-spacing:.04em;pointer-events:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.swc{width:40px;height:40px;border:0;border-radius:50%;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 3px rgba(42,35,70,.15)}
.swc.sel{box-shadow:0 0 0 4px #FFFFFF,0 0 0 7px var(--ink)}
.swc .swl{font:900 17px/1 var(--f-body);color:#fff;text-shadow:0 0 2px #2A2346,0 0 2px #2A2346,0 1px 0 #2A2346;pointer-events:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.tool{width:52px;height:52px;border:0;border-radius:16px;background:var(--paper);display:grid;place-items:center;font-size:24px;cursor:pointer;box-shadow:0 4px 0 var(--line-strong)}
.tool i{display:block;width:var(--d);height:var(--d);border-radius:50%;background:var(--ink)}
.tool.sel{background:var(--t-yellow);box-shadow:0 4px 0 #D39A00,inset 0 0 0 3px var(--sun)}
.tool-done{min-height:52px;padding:6px 18px;font-size:20px}
.wr-head{display:flex;align-items:center;justify-content:center;gap:14px}
.wr-ex{display:flex;align-items:center;gap:10px;font:900 26px var(--f-body);letter-spacing:.06em}
.wr-ex .pic{font-size:40px}
.draw-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(100%,520px)}
.sec-h{align-self:flex-start;margin:6px 0 0;font:700 24px/1.1 var(--f-display)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%}
.gallery img{width:100%;display:block;background:#FFFFFF;border-radius:16px;box-shadow:0 4px 0 var(--line-strong)}
.page-thumb{display:block;width:100%}
.page-thumb svg{display:block;width:100%;height:auto}
@keyframes dance{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-8px)}}
@media (max-width:560px){
  .lesson{grid-template-columns:auto minmax(0,1fr) auto}
  .cmp{grid-template-columns:1fr}
  .cmp-g .frame{font-size:30px}
}

/* schemes, sounds, camera */
.scheme{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px 8px;background:#FFFFFF;border-radius:20px;box-shadow:0 4px 0 var(--line)}
.scheme svg{display:block;width:min(100%,320px);height:auto}
.scheme figcaption{font:700 13px var(--f-body);color:var(--ink-soft)}
.cam{position:relative;flex:none;width:min(78vw,340px,48vh);aspect-ratio:200/220;overflow:hidden;background:#1E1A2E;border:12px solid var(--sun);border-radius:50%/48%;box-shadow:0 8px 0 #D39A00}
.cam video{display:block;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-ask{display:flex;flex-direction:column;gap:8px;max-width:640px;margin:0 auto 12px;padding:12px 14px;border-radius:20px;background:var(--t-blue);color:var(--ink)}.cam-ask p{margin:0;display:flex;flex-direction:column;gap:2px}.cam-ask b{font:800 18px var(--f-body)}.cam-ask small{font:600 14px/1.35 var(--f-body);color:var(--ink-soft)}
.cam-l{position:absolute;bottom:7%;left:50%;translate:-50% 0;padding:2px 12px;background:var(--paper);border-radius:99px;font:800 15px var(--f-body)}
.artic-stage.cam-on .mirror,.artic-stage.cam-on .cam{width:min(44vw,320px,40vh)}
/* honest exercises: the ring that fills while the pose is held, the hint, «Делаю!» (speech-honest) */
.hon{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;width:100%}
.hon-r{--p:0;position:relative;flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok,#2FA865) calc(var(--p) * 1%),var(--line) 0);transition:background .15s}
.hon-r::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--paper)}
.hon-r .emo{position:relative;font-size:34px;line-height:1}
.hon-r.ok{box-shadow:0 0 0 4px #BFF0D2}
.hon-l{flex:1 1 160px;font:800 19px/1.25 var(--f-body);color:var(--ink);min-height:1.25em}
.hon-hold{flex:1 1 100%;touch-action:none;user-select:none;-webkit-user-select:none}
.hon-hold.on{background:#2FA865;box-shadow:0 5px 0 #1E7A48;transform:translateY(2px)}
.hon-b{flex:1 1 100%}
.cam.hon-on{transition:border-color .2s}.cam.hon-on .cam-l{max-width:88%;width:max-content;text-align:center;line-height:1.2}.cam.held .cam-l{background:#DDF6E7}.cam.held{border-color:#2FA865;box-shadow:0 8px 0 #1E7A48}
.steps i.on.miss{filter:grayscale(1);opacity:.45}
/* «Послушай условие»: the answers wait for the instruction */
#stage.ls-wait button,#stage.ls-wait [data-id],#stage.ls-wait .card,#stage.ls-wait .item{opacity:.6;filter:saturate(.6);transition:opacity .3s}
.ls-ear{position:fixed;left:50%;bottom:calc(var(--guide-h,90px) + 14px);translate:-50% 0;z-index:30;display:flex;align-items:center;gap:8px;padding:8px 18px;border-radius:99px;background:var(--paper);box-shadow:0 4px 0 var(--line-strong);font:800 18px var(--f-body);color:var(--ink);pointer-events:none;animation:lsIn .3s ease}
.ls-ear .emo{font-size:30px;line-height:1;animation:lsBeat 1.2s ease-in-out infinite}
.ls-ear.ls-pic{padding:10px 22px;gap:12px}.ls-ear.ls-pic .emo{font-size:44px}.ls-g{display:inline-flex;font-size:40px;line-height:1}.ls-g svg{width:46px;height:46px}
.ls-ear.ls-go{background:#DDF6E7}
.ls-ear.ls-shake{animation:lsShake .4s ease}
#replay.ls-big{transform:scale(1.35);box-shadow:0 0 0 6px var(--t-yellow);animation:lsBeat 1.2s ease-in-out infinite}
.guide.ls-on #replay{width:58px;height:58px}
@keyframes lsIn{from{opacity:0;translate:-50% 12px}}
@keyframes lsBeat{50%{transform:scale(1.12)}}
@keyframes lsShake{25%{translate:calc(-50% - 8px) 0}75%{translate:calc(-50% + 8px) 0}}
@media (prefers-reduced-motion:reduce){.ls-ear,.ls-ear .emo,#replay.ls-big{animation:none}}
.snd-tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.snd-tab{width:76px;height:76px;border:0;border-radius:22px;background:var(--paper);font:900 46px/1 var(--f-body);cursor:pointer;box-shadow:0 5px 0 var(--line-strong)}
.snd-tab.sel{background:var(--t-yellow);box-shadow:0 5px 0 #D39A00,inset 0 0 0 4px var(--sun)}
.snd-steps{margin:0;padding:14px 18px 14px 40px;background:var(--paper);border-radius:20px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:6px;font:700 16px/1.4 var(--f-body)}
.snd-steps li::marker{font-weight:900;color:var(--tiger-deep)}
.ico-prof{display:block;width:96px}
.ico-prof svg{display:block;width:100%;height:auto}

/* two children, goal, together, reading speed */
.kids{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-top:6px}
.kid{display:flex;align-items:center;gap:8px;padding:6px 18px 6px 8px;border:0;border-radius:999px;background:var(--paper);font:800 18px var(--f-body);cursor:pointer;box-shadow:0 4px 0 var(--line-strong)}
.kid .chip-face{width:38px;height:38px}
.kid.sel{background:var(--t-yellow);box-shadow:0 4px 0 #D39A00,inset 0 0 0 3px var(--sun)}
.kids{flex-direction:column;align-items:center}
.kids-in{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.fam-chip{display:flex;align-items:center;gap:6px;padding:4px 14px;border:0;border-radius:999px;background:transparent;font:800 15px var(--f-body);color:var(--ink-soft);cursor:pointer;box-shadow:inset 0 0 0 2px var(--line-strong)}
.fam-chip .emo{font-size:18px}
/* families and the league */
.cc{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}

.cc-t{font-family:Nunito,'Trebuchet MS',sans-serif;font-weight:900;fill:#2A2346;text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:.6px}
.cc-sw{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border:0;border-radius:18px;background:var(--c);box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer}
.cc-sw b{font:900 20px var(--f-body);color:#2A2346;background:#fff;border-radius:10px;padding:2px 6px}
.cc-sw.sel{outline:5px solid var(--ink);outline-offset:3px}
.cc-pal{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.picks-g.three{grid-template-columns:repeat(3,minmax(0,1fr))}

.cheer{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);border-radius:22px;padding:10px 12px;margin-bottom:8px;box-shadow:0 5px 0 var(--line-strong),inset 0 0 0 3px var(--sun)}
.cheer .emo{font-size:36px;line-height:1}
.ch-tx{flex:1;display:flex;flex-direction:column;font:700 17px/1.3 var(--f-body)}
.ch-tx b{font:800 15px var(--f-body);color:var(--ink-soft)}
.ivs{display:flex;flex-direction:column;gap:10px;width:100%;max-width:660px;margin:0 auto;padding-bottom:24px}
.iv-row{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);border-radius:20px;padding:10px 12px;box-shadow:0 4px 0 var(--line)}
.iv-e{font:36px/1 var(--f-emoji)}
.iv-t{flex:1;display:flex;flex-direction:column;min-width:0}

.iv-t small{font:700 14px var(--f-body);color:var(--ink-soft)}

.fam-chip.inv{background:var(--t-yellow);color:var(--ink);box-shadow:0 3px 0 #D39A00}

.gk-box{display:flex;flex-direction:column;gap:10px;width:100%}
.gk{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:18px;background:var(--sky)}
.gk-h{display:flex;align-items:center;gap:8px}
.gk-h .chip-face{width:44px;height:44px}

.gk-i{font:800 17px var(--f-body);white-space:nowrap}

.gk-last li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:1px dashed rgba(0,0,0,.12);padding-bottom:3px}
.gk-last small{flex:none;font:700 14px var(--f-body);color:var(--ink-soft)}
.gk-day{margin:0;font:800 18px/1.35 var(--f-body)}
.gk-sum{margin:0;font:700 15px/1.4 var(--f-body);color:var(--ink-soft)}
.gk-s{margin:4px 0 0;font:800 16px var(--f-body)}
.gk-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.gk-d{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:10px;background:rgba(255,255,255,.6);font:800 17px var(--f-body);color:var(--ink-soft)}
.gk-d small{font:800 12px var(--f-body)}
.gk-d.on{background:#fff;color:var(--ink)}
.gk-d.now{outline:3px solid var(--sea)}
.gk-pr{display:flex;flex-wrap:wrap;gap:8px}

.gk-at{margin:0;font:700 14px var(--f-body);color:var(--ink-soft)}
.g-hearts p{margin:4px 0 0;font:700 17px var(--f-body)}
.kids-fam{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hold.mic .mic-big{font-size:48px;line-height:1}
.hol-ic{font:700 15px var(--f-emoji),700 15px var(--f-body)}
.hol-icons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hi{display:flex;align-items:center;gap:4px;border:0;border-radius:14px;padding:6px 10px;background:var(--sky);color:var(--ink);font:800 16px var(--f-body);cursor:pointer;box-shadow:0 3px 0 var(--line-strong)}
.hi span{font-size:15px}
.hi.off{background:var(--t-green)}
.fe-cc{display:flex;flex-direction:column;gap:6px;font:800 15px var(--f-body)}
.fe-cc select{font:700 17px var(--f-body);padding:10px 12px;border-radius:14px;border:3px solid var(--line-strong);background:#fff;color:#2A2346}
.wl{display:flex;flex-direction:column;gap:14px;width:100%;max-width:660px;margin:0 auto;padding-bottom:24px}
.wl-c{display:flex;flex-direction:column;gap:10px;background:var(--paper);color:var(--ink);border-radius:24px;padding:14px;box-shadow:0 5px 0 var(--line)}
.wl-h{display:flex;align-items:center;gap:10px}
.wl-f{font:40px/1 var(--f-emoji)}
.wl-h b{flex:1;font:800 22px var(--f-body)}
.wl-t{border:0;border-radius:14px;padding:8px 12px;background:var(--sky);color:var(--ink);font:800 18px var(--f-body);cursor:pointer;box-shadow:0 3px 0 var(--line-strong)}
.wl-who{display:flex;flex-wrap:wrap;gap:8px}
.wl-p{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--sky);font:800 16px var(--f-body)}

.ks-date{font:700 18px var(--f-body);padding:10px 12px;border-radius:14px;border:3px solid var(--line-strong);background:#fff;color:#2A2346;width:min(100%,260px)}
.dict{display:flex;flex-direction:column;gap:12px;width:100%;max-width:660px;margin:0 auto;padding-bottom:20px}

.d-m .d-lb{font:italic 700 15px/1.4 var(--f-body);color:var(--ink-soft)}

.d-wp{padding:10px 12px;border-radius:14px;background:var(--sky)}
.d-wp p{margin:4px 0 0;font:600 15px/1.45 var(--f-body)}
.d-more{margin:0;font:700 14px/1.6 var(--f-body);color:var(--ink-soft)}

.fe-row .fe-name{flex:none;min-width:0;font:700 18px var(--f-body);padding:10px 12px;border-radius:14px;border:3px solid var(--line-strong);background:#fff;color:#2A2346}
.fe-chips{display:flex;gap:6px}
.fe-chips .chip{padding:6px 12px;font-size:15px;box-shadow:0 3px 0 var(--line-strong)}
.fe-chips .chip.sel,.lg-tabs .chip.sel{background:var(--t-yellow);box-shadow:0 3px 0 #D39A00,inset 0 0 0 3px var(--sun)}
.fe-age{display:flex;flex-direction:column;align-items:stretch;gap:6px;font-weight:800}
.fe-row select{font:700 16px var(--f-body);padding:8px 10px;border-radius:12px;border:3px solid var(--line-strong);background:#fff;color:#2A2346;max-width:100%}
.fe-track{flex:1 1 230px;min-width:0}
.fe-x{align-self:flex-end;border:0;background:transparent;font:800 15px var(--f-body);color:var(--berry);cursor:pointer;padding:6px 8px}
.fe-err{margin:0;min-height:1.3em;text-align:center;color:var(--berry);font-weight:800}
.fe-imp summary{cursor:pointer;font-weight:800}
.fe-imp textarea{width:100%;font:600 16px var(--f-body);border-radius:12px;border:3px solid var(--line-strong);padding:8px}
.fe-note{text-align:center}
.fam-tile{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:22px;padding:8px 10px 8px 8px;box-shadow:0 5px 0 var(--line)}
.fam-tile.sel{box-shadow:0 5px 0 #D39A00,inset 0 0 0 3px var(--sun)}
.fam-use{flex:1;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;cursor:pointer;font:inherit;color:inherit;min-width:0;padding:4px}
.fam-faces{display:flex;flex:none}
.fam-faces .chip-face{width:42px;height:42px;margin-right:-10px}
.fam-t{display:flex;flex-direction:column;min-width:0;padding-left:12px;flex:1}
.fam-t b{font:800 19px var(--f-body)}
.fam-t small{font:700 14px/1.3 var(--f-body);color:var(--ink-soft)}
.fam-now{font-style:normal;font-weight:800;font-size:13px;background:var(--t-yellow);border-radius:999px;padding:2px 10px;flex:none}
.lg-cta,.lg-card{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:26px;padding:14px 16px;background:var(--paper);color:var(--ink);box-shadow:0 6px 0 var(--line-strong);text-align:left;font:inherit;cursor:pointer}
.lg-card{box-shadow:0 6px 0 var(--line-strong),inset 0 0 0 4px var(--sun)}
.lg-cta .emo,.lg-card .emo{font-size:42px;line-height:1;flex:none}
.lg-t{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.lg-t b{font:800 20px var(--f-body)}
.lg-t small{font:700 15px/1.35 var(--f-body);color:var(--ink-soft)}
.lg-top{display:flex;flex-wrap:wrap;gap:4px 12px}
.lg-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:2px 2px 6px}
.lg-tabs .chip{flex:none;padding:8px 14px}
.lg-sub{margin:0;text-align:center;color:var(--ink-soft);font-weight:700}
.lg-list{display:flex;flex-direction:column;gap:8px;width:100%}
.lg-row{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 var(--line)}
.fam-card .lg-row{background:var(--sky)}
.lg-row.me{box-shadow:0 4px 0 #D39A00,inset 0 0 0 3px var(--sun)}
.lg-pl{width:34px;flex:none;text-align:center;font-size:26px;line-height:1}
.lg-pl i{font:800 18px var(--f-body);font-style:normal;color:var(--ink-soft)}
.lg-row .chip-face{width:44px;height:44px;flex:none}
.lg-n{flex:1;display:flex;flex-direction:column;min-width:0}
.lg-n b{font:800 18px var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-n small{font:700 13px/1.3 var(--f-body);color:var(--ink-soft)}
.lg-v{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.lg-v b{font:900 24px/1 var(--f-body)}
.lg-v small{font:700 12px var(--f-body);color:var(--ink-soft)}
.lg-empty,.lg-note{text-align:center}
.lg-hero{display:flex;gap:12px;align-items:center}
.lg-hero .pic{font-size:64px}
.lg-hero h2{margin:0;font:700 26px/1.1 var(--f-display)}
.lg-hero p{margin:4px 0 0;font-weight:700;line-height:1.4;color:var(--ink-soft)}
.goal,.team{background:var(--paper);border-radius:26px;padding:16px;box-shadow:0 6px 0 var(--line-strong)}
.goal{display:flex;align-items:center;gap:14px;box-shadow:0 6px 0 var(--line-strong),inset 0 0 0 4px var(--plum)}
.goal-ico{font-size:52px;line-height:1}
.goal-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.goal-t b{font:700 22px/1.1 var(--f-display)}
.goal-t small{font:700 14px/1.3 var(--f-body);color:var(--ink-soft)}
.goal-bar,.chest-bar{display:block;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.goal-bar i,.chest-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--plum),var(--berry))}
.team{display:flex;flex-direction:column;gap:12px}
.team-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.team-top h2{margin:0;font:700 clamp(24px,4vw,30px)/1.1 var(--f-display)}
.team-top .muted{margin:0}
.team-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tm{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:18px;background:var(--sky);min-width:96px}
.tm.ok{background:var(--t-green)}
.tm-face{display:block;width:54px;height:54px}
.tm-face svg{width:100%;height:100%}
.tm b{font:700 17px var(--f-display)}
.tm small{font:700 13px var(--f-body);color:var(--ink-soft)}
.tm-plus{font:900 28px var(--f-body);color:var(--ink-soft)}
.chest{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px}
.chest .emo{font-size:34px;line-height:1}
.chest small{font:700 14px var(--f-body);color:var(--ink-soft)}
.team .big{align-self:flex-start}
.tiles>.tile:only-child{grid-column:1/-1}
@media (min-width:760px){.tiles>.tile:last-child:nth-child(4n+1){grid-column:1/-1}}
.tw-card{width:min(100%,640px);padding:22px 24px;background:var(--paper);border-radius:28px;box-shadow:0 6px 0 var(--line);text-align:center}
.tw-n{margin:0 0 6px;font:800 15px var(--f-body);color:var(--ink-soft)}
.tw-text{margin:0;font:800 clamp(24px,5.4vw,36px)/1.35 var(--f-body);text-wrap:balance}
.tw-step{margin:12px 0 0;font:700 18px var(--f-display);color:var(--plum)}
.sy-table{display:flex;flex-direction:column;gap:8px;width:min(100%,640px)}
.sy-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sy-cell{padding:10px 4px;border:0;border-radius:16px;background:var(--paper);font:900 clamp(22px,5vw,34px)/1 var(--f-body);cursor:pointer;box-shadow:0 4px 0 var(--line-strong)}
.sp-bar{display:flex;align-items:center;justify-content:center;gap:16px}
.sp-time{min-width:96px;font:900 40px/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--plum)}
.speed{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.sp-title{margin:0;font:700 26px/1.1 var(--f-display)}
.sp-text{width:min(100%,680px);padding:18px 22px;background:var(--paper);border-radius:24px;box-shadow:0 5px 0 var(--line);font:700 clamp(19px,4.4vw,24px)/1.65 var(--f-body);transition:filter .3s}
.sp-text.wait{filter:blur(7px);user-select:none}
.sp-res{margin:0;font:700 20px var(--f-display)}
.sp-res b{font:900 44px var(--f-body);color:var(--plum)}
.wpm{margin:0;width:min(100%,560px);padding:12px 14px 8px;background:var(--paper);border-radius:22px;box-shadow:0 4px 0 var(--line)}
.wpm-bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.wpm-bars span{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.wpm-bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--sea)}
.wpm-bars span:last-child i{background:var(--plum)}
.wpm-bars b{font:800 12px var(--f-body);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.wpm figcaption{margin-top:4px;font:700 13px var(--f-body);color:var(--ink-soft);text-align:center}
.book-wrap{display:flex;flex-direction:column;gap:14px;width:min(100%,640px)}
.book-card{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--paper);border-radius:24px;box-shadow:0 5px 0 var(--line)}
.book-card div{display:flex;flex-direction:column;gap:2px}
.book-card b{font:700 22px/1.15 var(--f-display)}
.book-card small{font:700 14px var(--f-body);color:var(--ink-soft)}
.book-ico{font-size:48px;line-height:1}
.mins{display:flex;gap:8px;flex-wrap:wrap}
.chip.mn.sel{background:var(--t-yellow);box-shadow:0 5px 0 #D39A00}
.book-log .big{align-self:flex-start}
.days14{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.d14{display:flex;flex-direction:column;align-items:center;gap:2px;font:800 11px var(--f-body);color:var(--ink-soft)}
.d14 i{width:100%;aspect-ratio:1;max-width:44px;border-radius:12px;background:var(--paper);display:grid;place-items:center;font:800 14px var(--f-body);font-style:normal;color:var(--ink-soft)}
.d14.on i{background:var(--t-yellow)}
.d14 .star-i{width:70%;height:70%}
.d14.now i{box-shadow:inset 0 0 0 3px var(--plum)}
.duo{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.duo-team{display:flex;gap:14px;justify-content:center}
.duo-p{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px;border-radius:20px;background:var(--paper);opacity:.55;box-shadow:0 4px 0 var(--line)}
.duo-p.on{opacity:1;background:var(--t-yellow);box-shadow:0 4px 0 #D39A00}
.duo-p b{font:700 18px var(--f-display)}
.duo-s{font:900 26px var(--f-body);color:var(--plum)}
.duo-bar{width:min(100%,520px);height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.duo-bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--leaf),var(--sun))}
.prow select{font:700 18px var(--f-body);padding:12px 14px;border-radius:14px;border:3px solid var(--line-strong);background:#fff;color:var(--ink);width:min(100%,320px)}
.face .tg{transform-box:fill-box;transform-origin:center}
.face.turkey .tg{animation:pat .16s infinite alternate}

.el-list{display:flex;flex-direction:column;gap:8px}
.el-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--sky)}
.el-row .big{min-height:48px;padding:6px 16px;font-size:18px}
.el-row .ibtn svg{width:24px;height:24px}
.el-t{flex:1;min-width:0;display:flex;flex-direction:column}
.el-t b{font:700 18px var(--f-display)}
.el-t small{font:700 13px/1.3 var(--f-body);color:var(--ink-soft);overflow-wrap:anywhere}

/* «Миссия Л»: Sava's night-castle look */
body.quest{--sky:#121833;--ink:#EEF1FF;--ink-soft:#A8B0D8;--paper:#20284A;--tiger:#FFAA2B;--tiger-deep:#E08E10;--berry:#FF6B8E;--leaf:#38CF86;--sun:#FFC83A;--sea:#62ABFF;--plum:#B49BFF;
  --t-blue:#1F2C55;--t-green:#183A39;--t-peach:#3B2B25;--t-lilac:#2D2651;--t-pink:#3A2342;--t-yellow:#3A3320;--t-mint:#173936;
  --line:rgba(255,255,255,.09);--line-strong:rgba(0,0,0,.5);--shade:rgba(5,8,20,.72);--f-display:"Russo One","Balsamiq Sans",system-ui,sans-serif;color-scheme:dark;
  background-image:radial-gradient(1.6px 1.6px at 12% 14%,#FFFFFF 50%,transparent 52%),radial-gradient(1.2px 1.2px at 31% 6%,#FFFFFF 50%,transparent 52%),radial-gradient(1.6px 1.6px at 58% 11%,#FFF3C4 50%,transparent 52%),radial-gradient(1.2px 1.2px at 77% 22%,#FFFFFF 50%,transparent 52%),radial-gradient(1.8px 1.8px at 91% 8%,#FFFFFF 50%,transparent 52%),radial-gradient(1.2px 1.2px at 45% 27%,#C9D4FF 50%,transparent 52%),radial-gradient(ellipse 70% 45% at 85% -5%,rgba(98,171,255,.2),transparent 70%),radial-gradient(ellipse 50% 35% at 0% 100%,rgba(180,155,255,.14),transparent 70%)}
body.quest .logo.q{color:var(--ink);font:400 clamp(34px,8vw,54px)/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
body.quest .logo .ql{color:var(--sun);text-shadow:0 0 22px rgba(255,200,58,.55)}
body.quest .logo .sub{font:700 16px var(--f-body);color:var(--ink-soft);text-transform:none;letter-spacing:0;margin-top:8px}
body.quest .prow input,body.quest .prow select{background:#11162B;color:var(--ink);border-color:rgba(255,255,255,.16)}
body.quest .scheme figcaption{color:#5E5683}
body.quest .winbox h2{color:var(--sun)}
body.quest .said{color:#2A2346}
body.quest .l-bar{background:rgba(255,255,255,.12)}
body.quest .tile{box-shadow:0 7px 0 rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.07)}
body.quest .tile b,body.quest h2,body.quest .bar h1{letter-spacing:.01em}
.rank{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--paper);border-radius:22px;box-shadow:0 5px 0 var(--line-strong),inset 0 0 0 2px rgba(255,200,58,.35)}
.rank-ico{font-size:40px;line-height:1}
.rank div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rank b{font:400 22px/1 var(--f-display);color:var(--sun)}
.rank small{font:700 13px var(--f-body);color:var(--ink-soft)}
.rank-bar{display:block;height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.rank-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--sun),var(--tiger))}
.rap{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.rap-lvl{margin:0;font:400 22px var(--f-display);color:var(--sun)}
.rap-count{min-height:48px;font:400 44px/1 var(--f-display);color:var(--plum)}
.rap-words{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(100%,640px)}
.rw{display:grid;place-items:center;min-height:74px;padding:6px;border-radius:18px;background:var(--paper);font:900 clamp(20px,5vw,32px)/1.1 var(--f-body);text-align:center;box-shadow:0 5px 0 var(--line-strong);transition:transform .08s,background-color .08s}
.rw.on{background:var(--sun);color:#2A2346;transform:scale(1.08)}
.rw.on b.r{color:#C2185B}
.rap-beat{display:flex;gap:12px}
.rap-beat i{width:18px;height:18px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line-strong)}
.rap-beat i.on{background:var(--berry);box-shadow:0 0 14px var(--berry)}
.arena{position:relative;width:100%;flex:1;min-height:360px;overflow:hidden;border-radius:26px;background:linear-gradient(#1B2350,#0F1430);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);touch-action:none}
.hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3;font:800 18px var(--f-body);color:#EEF1FF}
.arena-go{position:absolute;left:50%;top:45%;translate:-50% -50%;z-index:4}
.fall{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 8px 4px;border:0;border-radius:16px;background:rgba(255,255,255,.1);color:#EEF1FF;font-size:44px;cursor:pointer;will-change:transform;touch-action:none}
.fall small{font:800 14px var(--f-body);color:#EEF1FF}
.fall.got{background:rgba(56,207,134,.55)}
.fall.bad{background:rgba(255,107,142,.6);animation:wig .3s}
.arena-end{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;color:#EEF1FF;background:rgba(10,14,32,.82)}
.arena-end b{font:400 30px var(--f-display);color:var(--sun)}
.arena-end p{margin:0;font:800 22px/1.5 var(--f-body)}
.wd-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.wd-grid{display:flex;flex-direction:column;gap:6px}
.wd-row{display:grid;grid-template-columns:repeat(5,clamp(46px,13vw,60px));gap:6px}
.wd-c{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line-strong);font:900 clamp(24px,6vw,32px)/1 var(--f-body)}
.wd-c.full{box-shadow:inset 0 0 0 2px var(--ink-soft)}
.wd-c.g,.wd-c.y,.wd-c.x{animation:popin .35s both;box-shadow:none}
.wd-c.g{background:#2FA865;color:#fff}
.wd-c.y{background:#E2B100;color:#2A2346}
.wd-c.x{background:#4A5170;color:#C9CEE6}
.kb{display:flex;flex-direction:column;gap:6px;width:min(100%,560px)}
.kb-r{display:flex;gap:4px;justify-content:center}
.kb-k{flex:1;min-width:0;height:48px;border:0;border-radius:8px;background:var(--paper);color:var(--ink);font:800 clamp(14px,3.6vw,18px)/1 var(--f-body);cursor:pointer;box-shadow:0 3px 0 var(--line-strong)}
.kb-k.wide{flex:1.6;font-size:14px}
.kb-k.g{background:#2FA865;color:#fff}
.kb-k.y{background:#E2B100;color:#2A2346}
.kb-k.x{background:#3A4060;color:#8B92B3}
.boss-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.boss{position:relative;width:clamp(140px,34vmin,220px)}
.boss svg{width:100%;height:auto;display:block;filter:hue-rotate(200deg) saturate(3) drop-shadow(0 0 18px rgba(255,107,142,.55));animation:bob 2s ease-in-out infinite}
.boss.hit svg{animation:wig .4s}
.boss.down svg{opacity:.25;transform:scale(.6) rotate(-20deg);transition:all .6s}
.boss-dmg{position:absolute;top:0;right:0;font:400 32px var(--f-display);color:var(--berry);opacity:0}
.boss.hit .boss-dmg{animation:fly .8s ease-out}
.hp{position:relative;width:min(100%,420px);height:22px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--berry),var(--tiger));transition:width .5s}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font:900 14px var(--f-body);color:#fff}
.rec-out{display:flex;flex-direction:column;align-items:center;gap:12px}
.rec-out audio{width:min(100%,360px)}

.howto-steps{margin:0;padding:12px 18px 12px 40px;width:min(100%,640px);background:var(--paper);border-radius:20px;box-shadow:0 4px 0 var(--line);font:700 16px/1.45 var(--f-body)}
.howto-steps li::marker{font-weight:900;color:var(--tiger-deep)}
.sy-cell.next{background:var(--sun);transform:scale(1.07);box-shadow:0 0 0 4px #FFFFFF,0 6px 0 #D39A00}
.sy-cell.done{opacity:.35}
.book-note{margin:0;padding:10px 16px;border-radius:16px;background:var(--t-green);font:700 15px/1.4 var(--f-body)}
.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(100%,520px)}
.bin{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px;border:0;border-radius:24px;background:var(--paper);cursor:pointer;box-shadow:0 7px 0 var(--line-strong)}
.bin .emo{font-size:52px;line-height:1}
.bin b{font:900 54px/1 var(--f-body)}
.bin small{font:700 14px var(--f-body);color:var(--ink-soft)}
.pn-top{width:min(100%,680px)}
.pn-line{margin:0;padding:10px 16px;border-radius:18px;background:var(--paper);text-align:center;font:700 16px/1.4 var(--f-body);box-shadow:0 4px 0 var(--line)}
.pn-line .la{display:inline-block;padding:0 8px;border-radius:8px;background:var(--sun);color:#2A2346;font-weight:900}
.piano{position:relative;display:flex;width:min(100%,680px);height:clamp(170px,32vh,260px);padding:10px 10px 12px;border-radius:18px;background:#1E1A2E;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.pk.w{flex:1;position:relative;margin:0 2px;border:0;border-radius:0 0 10px 10px;background:linear-gradient(#FFFFFF,#ECEAF4);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;cursor:pointer;touch-action:none;box-shadow:inset 0 -6px 0 #D4D0E2}
.pk.w span{font:800 clamp(10px,2.4vw,14px) var(--f-body);color:#5E5683}
